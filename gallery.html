<!DOCTYPE html>
<html>
  <head>
    <title>Gallery | Moon Muffin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="video-gallery" style="display: flex; flex-wrap: wrap; gap: 16px">
      <!-- Cards will be dynamically inserted here -->
    </div>
    <script>
      const friends = [
        {
          name: "Arsa",
          message:
            "Hi all! \n\nI hope this message finds you well. I wanted to take a moment to sincerely apologize for any misunderstandings or inconveniences I may have caused. Your friendship means the world to me, and I truly appreciate your kindness and support. Thank you for being such a wonderful friend.\n\nWarm regards,\nArsa",
          video: "./assets/videos/arsa.mp4",
        },
        {
          name: "Kojo",
          message:
            "Hi all!\n\nI hope you're doing great. I am writing to express my heartfelt apologies for any mistakes I might have made. Your friendship is incredibly valuable to me, and I am grateful for your patience and understanding. Thank you for being an amazing friend.\n\nBest wishes,\nKojo",
          video: "./assets/videos/kojo.mp4",
        },
      ];

      const gallery = document.getElementById("video-gallery");

      friends.forEach((friend) => {
        const card = document.createElement("div");
        card.style.width = "200px";
        card.style.border = "1px solid #ccc";
        card.style.borderRadius = "8px";
        card.style.overflow = "hidden";
        card.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.1)";

        const video = document.createElement("video");
        video.src = friend.video;
        video.muted = true;
        video.autoplay = true;
        video.loop = true;
        video.style.width = "100%";
        video.style.height = "auto";

        const name = document.createElement("p");
        name.textContent = friend.name;
        name.style.textAlign = "center";
        name.style.margin = "8px 0";

        card.appendChild(video);
        card.appendChild(name);
        gallery.appendChild(card);
      });
    </script>
  </body>
</html>
