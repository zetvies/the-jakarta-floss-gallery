<!DOCTYPE html>
<html>
  <head>
    <title>Gallery | Moon Muffin</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body style="background-color: #edf0e7; padding: 4svh 8svh">
    <div style="display: flex; flex-direction: column; align-items: center">
      <div
        onclick="window.location.href='/index.html'"
        style="
          position: fixed;
          top: 24px;
          left: 24px;
          width: 50px;
          height: 50px;
          background-color: white;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        "
      >
        <svg
          width="28"
          height="28"
          viewBox="0 0 28 28"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M18.3227 8.645L16.6777 7L9.67773 14L16.6777 21L18.3227 19.355L12.9794 14L18.3227 8.645Z"
            fill="#046511"
          />
        </svg>
      </div>
      <h1
        style="
          font-family: Inter;
          color: #046511;
          font-size: 2rem;
          font-weight: 500;
        "
      >
        Maaf yang Udah
        <span
          style="
            color: #ff3755;
            font-family: OtherHand;
            font-size: 2.4rem;
            font-weight: 600;
          "
          ;
          >Diterima</span
        >
      </h1>
    </div>
    <div id="video-gallery" style="display: flex; flex-wrap: wrap; gap: 16px">
      <!-- Cards will be dynamically inserted here -->
    </div>
    <div
      id="modal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 100;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      "
    >
      <div
        id="modal-content"
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 20px;
          width: fit-content;
        "
      >
        <div
          style="
            width: 200px;
            padding: 2vh;
            background-color: white;
            overflow: visible;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transform: rotate(-3deg);
            position: relative;
          "
        >
          <button
            style="
              position: absolute;
              top: -12px;
              left: -12px;
              background-color: #92ed00;
              border: none;
              border-radius: 50%;
              width: 24px;
              height: 24px;
              display: flex;
              justify-content: center;
              align-items: center;
              cursor: pointer;
              z-index: 30;
            "
            onclick="document.getElementById('modal').style.display = 'none'; document.getElementById('modal-video').pause();"
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 12 12"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M11.25 1.8075L10.1925 0.75L6 4.9425L1.8075 0.75L0.75 1.8075L4.9425 6L0.75 10.1925L1.8075 11.25L6 7.0575L10.1925 11.25L11.25 10.1925L7.0575 6L11.25 1.8075Z"
                fill="#046511"
              />
            </svg>
          </button>
          <video
            id="modal-video"
            style="width: 200px; height: 300px; object-fit: cover"
            autoplay
            loop
          ></video>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <div
              id="modal-name"
              style="margin-top: 2svh; font-size: 1.5rem; flex: 1"
            ></div>
            <img
              src="./assets/images/highfive.png"
              style="height: 24px; width: auto; transform: translateY(5px)"
            />
          </div>
        </div>
        <button
          id="prevButton"
          style="
            position: absolute;
            left: 8svh;
            top: 50%;
            transform: translateY(-50%);
            background-color: #92ed00;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
          "
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M15.41 7.41L14 6L8 12L14 18L15.41 16.59L10.83 12L15.41 7.41Z"
              fill="#046511"
            />
          </svg>
        </button>
        <button
          id="nextButton"
          style="
            position: absolute;
            right: 8svh;
            top: 50%;
            transform: translateY(-50%);
            background-color: #92ed00;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
          "
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8.59 16.59L10 18L16 12L10 6L8.59 7.41L13.17 12L8.59 16.59Z"
              fill="#046511"
            />
          </svg>
        </button>
        <div
          style="
            padding: 20px;
            width: 30%;
            background-color: white;
            transform: rotate(3deg);
          "
        >
          <p id="modal-message" style="font-size: 1.2rem; color: #046511"></p>
        </div>
      </div>
      <button
        style="
          background-color: #92ed00;
          border: none;
          padding: 10px 20px;
          border-radius: 5px;
          cursor: pointer;
          margin-top: 20px;
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 1.2rem;
          color: #046511;
        "
      >
        Download & Share
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M18 15V18H6V15H4V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V15H18ZM17 11L15.59 9.59L13 12.17V4H11V12.17L8.41 9.59L7 11L12 16L17 11Z"
            fill="#046511"
          />
        </svg>
      </button>
    </div>
    <script>
      const friends = [
        {
          name: "Arsa",
          message:
            "Hi all! \n\nI hope this message finds you well. I wanted to take a moment to sincerely apologize for any misunderstandings or inconveniences I may have caused. Your friendship means the world to me, and I truly appreciate your kindness and support. Thank you for being such a wonderful friend.\n\nWarm regards,\nArsa",
          video: "./assets/videos/arsa.mp4",
        },
        {
          name: "Kojo",
          message:
            "Hi all!\n\nI hope you're doing great. I am writing to express my heartfelt apologies for any mistakes I might have made. Your friendship is incredibly valuable to me, and I am grateful for your patience and understanding. Thank you for being an amazing friend.\n\nBest wishes,\nKojo",
          video: "./assets/videos/kojo.mp4",
        },
      ];

      const gallery = document.getElementById("video-gallery");
      const modal = document.getElementById("modal");
      const modalVideo = document.getElementById("modal-video");
      const modalMessage = document.getElementById("modal-message");

      let currentIndex = 0;

      function updateModalContent(index) {
        const friend = friends[index];
        modalVideo.src = friend.video;
        modalMessage.innerHTML = friend.message.replace(/\n/g, "<br>");
        document.getElementById("modal-name").textContent = friend.name;

        // Apply random rotation to video and letter
        const randomRotationVideo = Math.random() * 10 - 5; // Random rotation between -5 and 5 degrees
        const randomRotationLetter = Math.random() * 10 - 5; // Random rotation between -5 and 5 degrees
        const videoContainer = document.querySelector(
          "#modal-content > div:first-child"
        );
        const letterContainerModal = document.querySelector(
          "#modal-content > div:nth-child(3)"
        );
        if (videoContainer) {
          videoContainer.style.transform = `rotate(${randomRotationVideo}deg)`;
        }
        if (letterContainerModal) {
          letterContainerModal.style.transform = `rotate(${randomRotationLetter}deg)`;
        }
      }

      document.getElementById("prevButton").addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + friends.length) % friends.length;
        updateModalContent(currentIndex);
      });

      document.getElementById("nextButton").addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % friends.length;
        updateModalContent(currentIndex);
      });

      friends.forEach((friend, index) => {
        const card = document.createElement("div");
        card.style.width = "200px";
        card.style.border = "2vh solid white";
        card.style.backgroundColor = "white";
        card.style.overflow = "hidden";
        card.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.1)";
        card.style.cursor = "pointer";
        const randomRotation = Math.random() * 10 - 3;
        card.style.transform = `rotate(${randomRotation}deg)`;

        const video = document.createElement("video");
        video.src = friend.video;
        video.muted = true;
        video.autoplay = true;
        video.loop = true;
        video.style.width = "200px";
        video.style.height = "250px";
        video.style.objectFit = "cover";

        const nameContainer = document.createElement("div");
        nameContainer.style.display = "flex";
        nameContainer.style.justifyContent = "space-between";
        nameContainer.style.alignItems = "center";

        const name = document.createElement("div");
        name.style.marginTop = "2svh";
        name.textContent = friend.name;
        name.style.fontSize = "1.5rem";
        name.style.flex = "1";

        const highfiveImg = document.createElement("img");
        highfiveImg.src = "./assets/images/highfive.png";
        highfiveImg.style.height = "24px";
        highfiveImg.style.width = "auto";
        highfiveImg.style.transform = "translateY(5px)";

        nameContainer.appendChild(name);
        nameContainer.appendChild(highfiveImg);

        card.appendChild(video);
        card.appendChild(nameContainer);
        gallery.appendChild(card);

        card.addEventListener("click", () => {
          currentIndex = index;
          updateModalContent(currentIndex);
          modal.style.display = "flex";
        });
      });

      const modalContent = document.getElementById("modal-content");
      modalContent.removeEventListener("click", (event) => {
        if (event.target !== modalVideo && event.target !== modalMessage) {
          modal.style.display = "none";
          modalVideo.pause();
        }
      });

      // Add signature and highfive stickers to the bottom part of the letter
      const letterContainer =
        document.querySelector("#modal-message").parentElement;
      const signatureImg = document.createElement("img");
      signatureImg.src = "./assets/images/signature.png";
      signatureImg.alt = "Signature";
      signatureImg.style.height = "8svh";

      const highfiveImg = document.createElement("img");
      highfiveImg.src = "./assets/images/highfive.png";
      highfiveImg.alt = "High Five";
      highfiveImg.style.height = "6svh";

      const stickerContainer = document.createElement("div");
      stickerContainer.style.display = "flex";
      stickerContainer.style.gap = "16px";
      stickerContainer.style.alignItems = "end";
      stickerContainer.style.justifyContent = "space-between";
      stickerContainer.appendChild(signatureImg);
      stickerContainer.appendChild(highfiveImg);

      letterContainer.appendChild(stickerContainer);

      // Add event listener to close button
      const closeButton = document.querySelector("#modal-content button");
      closeButton.addEventListener("click", () => {
        modal.style.display = "none";
        modalVideo.pause();
      });

      // Ensure modal closes when clicking on the overlay
      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          modal.style.display = "none";
          modalVideo.pause();
        }
      });
    </script>
  </body>
</html>
