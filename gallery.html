<!DOCTYPE html>
<html>
  <head>
    <title>Gallery | Moon Muffin</title>
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        font-size: 2svh;
      }
      h1 {
        font-size: 3svh;
      }
      #video-gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }
      @media (max-width: 768px) {
        #video-gallery {
          flex-direction: column;
          align-items: center;
        }
      }
      #modal-content {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2svh;
        width: fit-content;
      }
      #modal-content > div {
        width: 20svh;
        padding: 2svh;
        background-color: white;
        overflow: visible;
        box-shadow: 0 0.4svh 0.8svh rgba(0, 0, 0, 0.1);
        transform: rotate(-3deg);
        position: relative;
      }
      #modal-video {
        width: 20svh;
        height: 30svh;
        object-fit: cover;
      }
      #modal-message {
        font-size: 1.5svh;
        color: #046511;
      }
      @media (max-width: 768px) {
        #modal-content {
          flex-direction: column;
          width: 100%;
        }
        #modal-content > div {
          width: 100%;
        }
      }
      button {
        width: 4svh;
        height: 4svh;
      }
      #prevButton,
      #nextButton {
        width: 4svh;
        height: 4svh;
      }
    </style>
  </head>

      <h1

        Maaf yang Udah

            font-weight: 600;

          >Diterima</span

    </div>
    <div

        display: flex;

        align-items: center;
        margin-bottom: 3svh;
        flex-direction: column;

      <div

          font-family: Inter;

          cursor: pointer;

            border-radius: 0.8svh;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 2.4svh;
          "
        >
          <div
            style="

              background-color: #92ed00;
              width: fit-content;
              padding: 1svh 2svh;
              border-radius: 0.8svh;
              cursor: pointer;
              margin-top: 1svh;
              display: flex;
              align-items: center;
              font-size: 2.7svh;
              text-decoration: none;
            "
          >
            Klik di sini!!
          </div>
        </div>
      </a>
    </div>
    <div id="video-gallery" style="display: flex; flex-wrap: wrap; gap: 16px">
      <!-- Cards will be dynamically inserted here -->
    </div>
    <div
      id="modal"
      style="
        display: none;
        position: fixed;

        left: 0;
        width: 100%;
        height: 100%;

      <div

          display: flex;

          justify-content: center;
          align-items: center;
          gap: 2svh;

        <div
          style="

            padding: 1.8svh;
            background-color: white;
            overflow: visible;
            box-shadow: 0 0.4svh 0.8svh rgba(0, 0, 0, 0.1);
            transform: rotate(-3deg);
            position: relative;
          "
        >
          <button
            style="
              position: absolute;
              top: -1.2svh;
              left: -1.2svh;
              background-color: #92ed00;
              border: none;
              border-radius: 50%;
              width: 4svh;
              height: 4svh;
              display: flex;
              justify-content: center;
              align-items: center;
              cursor: pointer;
              z-index: 30;
            "
            onclick="document.getElementById('modal').style.display = 'none'; document.getElementById('modal-video').pause();"
          >
            <svg
              width="2svh"
              height="2svh"
              viewBox="0 0 12 12"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M11.25 1.8075L10.1925 0.75L6 4.9425L1.8075 0.75L0.75 1.8075L4.9425 6L0.75 10.1925L1.8075 11.25L6 7.0575L10.1925 11.25L11.25 10.1925L7.0575 6L11.25 1.8075Z"
                fill="#046511"
              />
            </svg>
          </button>
          <video
            id="modal-video"
            style="width: 25vh; height: 30vh; object-fit: cover"
            autoplay
            loop
            playsinline
            webkit-playsinline
            x5-playsinline
          ></video>
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <div
              id="modal-name"
              style="margin-top: 2svh; font-size: 3svh; flex: 1"
            ></div>
            <img
              src="./assets/images/highfive.png"
              style="height: 3svh; width: auto; transform: translateY(0.5svh)"
            />
          </div>
        </div>
        <button
          id="prevButton"
          style="
            position: absolute;
            left: 3svh;
            top: 40%;
            transform: translateY(-50%);
            background-color: #92ed00;
            border: none;
            border-radius: 50%;
            width: 6svh;
            height: 6svh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 30;
          "
        >
          <svg
            width="4svh"
            height="4svh"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M15.41 7.41L14 6L8 12L14 18L15.41 16.59L10.83 12L15.41 7.41Z"
              fill="#046511"
            />
          </svg>
        </button>
        <button
          id="nextButton"
          style="
            position: absolute;
            right: 3svh;
            top: 40%;
            transform: translateY(-50%);
            background-color: #92ed00;
            border: none;
            border-radius: 50%;
            width: 6svh;
            height: 6svh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 30;
          "
        >
          <svg
            width="4svh"
            height="4svh"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8.59 16.59L10 18L16 12L10 6L8.59 7.41L13.17 12L8.59 16.59Z"
              fill="#046511"
            />
          </svg>
        </button>
        <div
          style="
            padding: 1.2svh;
            width: 80%;
            background-color: white;
            transform: rotate(3deg);
          "
        >
          <p id="modal-message" style="font-size: 2.4svh; color: #046511"></p>
        </div>
      </div>

    </div>
    <script>
      // Function to get URL parameters
      function getUrlParameter(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)");
        var results = regex.exec(location.search);
        return results === null
          ? ""
          : decodeURIComponent(results[1].replace(/\+/g, " ")).toUpperCase();
      }

      window.onload = function () {
        console.log("Page loaded, checking orderID...");
        const orderID = getUrlParameter("orderID");
        console.log("Current orderID:", orderID);

        if (!orderID) {
          console.log("No orderID found, redirecting to base URL...");
          window.location.replace(
            "https://moonmuffin.byc.plus/experience-app/ar"
          );
          return;
        }

        // Fetch content from API
        fetch(`https://moonmuffin.byc.plus/api/gallery?order_id=${orderID}`)
          .then((response) => {
            console.log("API Response status:", response.status);
            return response.json();
          })
          .then((data) => {
            console.log("API Response data:", data);
            if (!data || data.length === 0) {
              console.log(
                "No data received, redirecting to order-specific URL..."
              );
              window.location.replace(
                `https://moonmuffin.byc.plus/experience-app/ar/${orderID}`
              );
              return;
            }

            // Transform API data to match our stories structure
            stories = data.map((item) => ({
              name: item.name,
              message: item.message,
              video: item.video_url,
              signature: item.signature_url || "./assets/images/signature.png",
            }));
            console.log("Transformed stories:", stories);

            // Update the gallery UI
            stories.forEach((story, index) => {
              const card = document.createElement("div");
              card.style.width = "20svh";
              card.style.border = "2vh solid white";
              card.style.backgroundColor = "white";
              card.style.overflow = "hidden";
              card.style.boxShadow = "0 4px 8px rgba(0, 0, 0, 0.1)";
              card.style.cursor = "pointer";
              const randomRotation = Math.random() * 10 - 3;
              card.style.transform = `rotate(${randomRotation}deg)`;

              const video = document.createElement("video");
              video.src = story.video;
              video.muted = true;
              video.autoplay = true;
              video.loop = true;
              video.playsinline = true;
              video.setAttribute("webkit-playsinline", "true");
              video.setAttribute("x5-playsinline", "true");
              video.style.width = "20svh";
              video.style.height = "25svh";
              video.style.objectFit = "cover";

              const nameContainer = document.createElement("div");
              nameContainer.style.display = "flex";
              nameContainer.style.justifyContent = "space-between";
              nameContainer.style.alignItems = "center";
              nameContainer.style.padding = "1svh";

              const name = document.createElement("div");
              name.style.marginTop = "1svh";
              name.textContent = story.name;
              name.style.fontSize = "3svh";
              name.style.flex = "1";

              const highfiveImg = document.createElement("img");
              highfiveImg.src = "./assets/images/highfive.png";
              highfiveImg.style.height = "3svh";
              highfiveImg.style.width = "auto";
              highfiveImg.style.transform = "translateY(0.5svh)";

              nameContainer.appendChild(name);
              nameContainer.appendChild(highfiveImg);

              card.appendChild(video);
              card.appendChild(nameContainer);
              document.getElementById("video-gallery").appendChild(card);

              card.addEventListener("click", () => {
                currentIndex = index;
                updateModalContent(currentIndex);
                document.getElementById("modal").style.display = "flex";
              });
            });
          })
          .catch((error) => {
            console.error("Error fetching content:", error);
            console.log("Redirecting due to error...");
            window.location.replace(
              "https://moonmuffin.byc.plus/experience-app/ar"
            );
          });
      };

      const gallery = document.getElementById("video-gallery");
      const modal = document.getElementById("modal");
      const modalVideo = document.getElementById("modal-video");
      const modalMessage = document.getElementById("modal-message");
      let currentIndex = 0;
      let stories = [];

      function updateModalContent(index) {
        if (!stories || !stories[index]) {
          console.error("No story data available for index:", index);
          return;
        }
        const story = stories[index];
        modalVideo.src = story.video;
        modalMessage.innerHTML = story.message.replace(/\n/g, "<br>");
        document.getElementById("modal-name").textContent = story.name;

        // Update the signature dynamically
        const signatureImg = document
          .querySelector("#modal-message")
          .parentElement.querySelector("img[alt='Signature']");
        if (signatureImg && story.signature) {
          signatureImg.src = story.signature;
        }

        // Apply random rotation to video and letter
        const randomRotationVideo = Math.random() * 10 - 5;
        const randomRotationLetter = Math.random() * 10 - 5;
        const videoContainer = document.querySelector(
          "#modal-content > div:first-child"
        );
        const letterContainerModal = document.querySelector(
          "#modal-content > div:nth-child(3)"
        );
        if (videoContainer) {
          videoContainer.style.transform = `rotate(${randomRotationVideo}deg)`;
        }
        if (letterContainerModal) {
          letterContainerModal.style.transform = `rotate(${randomRotationLetter}deg)`;
        }
      }

      document.getElementById("prevButton").addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + stories.length) % stories.length;
        updateModalContent(currentIndex);
      });

      document.getElementById("nextButton").addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % stories.length;
        updateModalContent(currentIndex);
      });

      const modalContent = document.getElementById("modal-content");
      modalContent.removeEventListener("click", (event) => {
        if (event.target !== modalVideo && event.target !== modalMessage) {
          modal.style.display = "none";
          modalVideo.pause();
        }
      });

      // Add signature and highfive stickers to the bottom part of the letter
      const letterContainer =
        document.querySelector("#modal-message").parentElement;
      const signatureImg = document.createElement("img");
      signatureImg.src = "./assets/images/signature.png";
      signatureImg.alt = "Signature";
      signatureImg.style.height = "6svh";

      const highfiveImg = document.createElement("img");
      highfiveImg.src = "./assets/images/highfive.png";
      highfiveImg.alt = "High Five";
      highfiveImg.style.height = "4svh";

      const stickerContainer = document.createElement("div");
      stickerContainer.style.display = "flex";
      stickerContainer.style.gap = "16px";
      stickerContainer.style.alignItems = "end";
      stickerContainer.style.justifyContent = "space-between";
      stickerContainer.appendChild(signatureImg);
      stickerContainer.appendChild(highfiveImg);

      letterContainer.appendChild(stickerContainer);

      // Add event listener to close button
      const closeButton = document.querySelector("#modal-content button");
      closeButton.addEventListener("click", () => {
        modal.style.display = "none";
        modalVideo.pause();
      });

      // Ensure modal closes when clicking on the overlay
      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          modal.style.display = "none";
          modalVideo.pause();
        }
      });
    </script>
  </body>
