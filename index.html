<!DOCTYPE html>
<html>
  <head>
    <title>AR App | Moon Muffin</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.7.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden; z-index: 0">
    <a-scene
      style="z-index: 1"
      embedded
      arjs="debugUIEnabled: false; sourceType: webcam;"
      vr-mode-ui="enabled: false"
    >
      <!-- Define a marker using the Hiro pattern -->
      <a-marker type="pattern" url="pattern-highfive-black.patt">
        <!-- Add a white plane as a container for the video -->
        <a-plane
          color="white"
          width="1.1"
          height="2"
          position="0 0 0.1"
          rotation="-90 0 0"
        ></a-plane>
        <!-- Play a video on a plane with cropping effect -->
        <a-video
          src="#arsa-video"
          width=".9"
          height="1.6"
          position="0 0.05 0"
          rotation="-90 0 0"
        ></a-video>
        <!-- Overlay images in front of the video -->
        <a-image
          src="./assets/images/bedug.png"
          width="0.7"
          height="0.7"
          position="-8 0.5 -0.8"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/mosque.png"
          width="0.7"
          height="0.7"
          position=".75 0.4 0.7"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/ketupat.png"
          width="0.4"
          height="0.4"
          position="-0.6 0.2 0.8"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/love.png"
          width="0.55"
          height="0.55"
          position=".6 0.6 -.6"
          rotation="-90 0 0"
        ></a-image>

        <a-image
          src="./assets/images/star.png"
          width="0.6"
          height="0.6"
          position="-.8 0.4 0.1"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/sparkle.png"
          width="0.4"
          height="0.4"
          position=".6 0.2 0"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/moon.png"
          width="0.5"
          height="0.5"
          position="-.5 0.3 -0.6"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/moonmuffin.png"
          width=".6"
          height="0.2"
          position="0 0.2 .9"
          rotation="-90 0 0"
        ></a-image>
      </a-marker>
      <!-- Add a camera -->
      <a-entity camera></a-entity>
    </a-scene>
    <div
      id="stories"
      style="
        display: flex;
        align-items: center;
        position: fixed;
        top: 4vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: auto;
        gap: 16px;
      "
    >
      <div
        class="story-button"
        style="
          height: 60px;
          width: 60px;
          background-color: #000;
          border-radius: 50%;
          overflow: hidden;
        "
      >
        <video
          src="./assets/videos/arsa.mp4"
          loop
          muted
          autoplay
          playsinline
          style="width: 100%; height: 100%; object-fit: cover"
        ></video>
      </div>
      <div
        class="story-button"
        style="
          height: 60px;
          width: 60px;
          background-color: #000;
          border-radius: 50%;
          overflow: hidden;
        "
      >
        <video
          src="./assets/videos/kojo.mp4"
          loop
          muted
          autoplay
          playsinline
          style="width: 100%; height: 100%; object-fit: cover"
        ></video>
      </div>
    </div>
    <video
      id="arsa-video"
      src="./assets/videos/arsa.mp4"
      loop="true"
      style="display: none"
    ></video>
    <div
      id="showMessageButton"
      style="
        background-color: white;
        border-radius: 30px;
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0px 16px;
        color: #046511;
        position: fixed;
        bottom: 17svh;
        left: 50%;
        font-family: Inter;
        transform: translateX(-50%);
        z-index: 20;
      "
    >
      <p>Buka Pesan</p>
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6ZM20 6L12 10.99L4 6H20ZM20 18H4V8L12 13L20 8V18Z"
          fill="#046511"
        />
      </svg>
    </div>

    <div
      id="messageModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 30;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          position: relative;
          background-color: white;
          color: #046511;
          font-size: 1.4em;
          padding: 16px;
          max-width: 80%;
          max-height: 90svh;
          overflow-y: auto;
          text-align: left;
        "
      >
        <button
          id="closeModalButton"
          style="
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #92ed00;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
          "
        >
          <svg
            width="12"
            height="12"
            viewBox="0 0 12 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M11.25 1.8075L10.1925 0.75L6 4.9425L1.8075 0.75L0.75 1.8075L4.9425 6L0.75 10.1925L1.8075 11.25L6 7.0575L10.1925 11.25L11.25 10.1925L7.0575 6L11.25 1.8075Z"
              fill="#046511"
            />
          </svg>
        </button>
        <p id="modalMessage"></p>
        <div
          style="
            display: flex;
            gap: 16px;
            align-items: end;
            justify-content: space-between;
          "
        >
          <img
            src="./assets/images/signature.png"
            alt="Signature"
            style="height: 8svh"
          />
          <img
            src="./assets/images/highfive.png"
            alt="High Five"
            style="height: 6svh"
          />
        </div>
      </div>
    </div>
    <div
      id="recordButton"
      style="
        position: fixed;
        bottom: 5svh;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 50px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 20;
      "
    >
      <div
        id="recordInner"
        style="
          width: 30px;
          height: 30px;
          background-color: #92ed00;
          border-radius: 50%;
          transition: all 0.3s ease;
        "
      ></div>
    </div>
    <div
      id="menuButton"
      style="
        position: fixed;
        bottom: 5svh;
        left: calc(50% - 80px);
        transform: translateX(-50%);
        width: 50px;
        height: 50px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 20;
      "
    >
      <svg
        width="28"
        height="28"
        viewBox="0 0 28 28"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M14.0003 9.33268C15.2837 9.33268 16.3337 8.28268 16.3337 6.99935C16.3337 5.71602 15.2837 4.66602 14.0003 4.66602C12.717 4.66602 11.667 5.71602 11.667 6.99935C11.667 8.28268 12.717 9.33268 14.0003 9.33268ZM14.0003 11.666C12.717 11.666 11.667 12.716 11.667 13.9993C11.667 15.2827 12.717 16.3327 14.0003 16.3327C15.2837 16.3327 16.3337 15.2827 16.3337 13.9993C16.3337 12.716 15.2837 11.666 14.0003 11.666ZM14.0003 18.666C12.717 18.666 11.667 19.716 11.667 20.9994C11.667 22.2827 12.717 23.3327 14.0003 23.3327C15.2837 23.3327 16.3337 22.2827 16.3337 20.9994C16.3337 19.716 15.2837 18.666 14.0003 18.666Z"
          fill="#046511"
        />
      </svg>
    </div>

    <div
      id="swapCameraButton"
      style="
        position: fixed;
        bottom: 5svh;
        left: calc(50% + 80px);
        transform: translateX(-50%);
        width: 50px;
        height: 50px;
        background-color: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 20;
      "
    >
      <svg
        width="28"
        height="28"
        viewBox="0 0 28 28"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <g clip-path="url(#clip0_2207_3859)">
          <path
            d="M18.6667 8.16605H17.5L16.3333 6.99939H11.6667L10.5 8.16605H9.33333C8.05 8.16605 7 9.21605 7 10.4994V17.4994C7 18.7827 8.05 19.8327 9.33333 19.8327H18.6667C19.95 19.8327 21 18.7827 21 17.4994V10.4994C21 9.21605 19.95 8.16605 18.6667 8.16605ZM18.6667 17.4994H9.33333V10.4994H11.4683L12.635 9.33272H15.365L16.5317 10.4994H18.6667V17.4994Z"
            fill="#046511"
          />
          <path
            d="M14 16.3327C15.2887 16.3327 16.3333 15.2881 16.3333 13.9994C16.3333 12.7107 15.2887 11.6661 14 11.6661C12.7113 11.6661 11.6667 12.7107 11.6667 13.9994C11.6667 15.2881 12.7113 16.3327 14 16.3327Z"
            fill="#046511"
          />
          <path
            d="M9.99833 0.606054L15.225 5.83272L16.87 4.18772L15.0733 2.39105C20.65 2.86939 25.1183 7.27939 25.6667 12.8327H28C27.2533 3.84939 18.4217 -1.94895 9.99833 0.606054Z"
            fill="#046511"
          />
          <path
            d="M11.13 23.8111L12.9267 25.6077C7.35 25.1294 2.88167 20.7194 2.33333 15.1661H0C0.746667 24.1494 9.57833 29.9477 18.0017 27.3927L12.775 22.1661L11.13 23.8111Z"
            fill="#046511"
          />
        </g>
        <defs>
          <clipPath id="clip0_2207_3859">
            <rect width="28" height="28" fill="white" />
          </clipPath>
        </defs>
      </svg>
    </div>
    <div
      id="markerNotFoundOverlay"
      style="
        font-family: Inter;
        position: fixed;
        height: 100svh;
        width: 100svw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.4);
        color: white;
        display: flex;
        font-size: 1.3em;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 2;
        padding-bottom: 10svh;
      "
    >
      <p>Arahkan kameramu ke<br />logo Moon Muffin:</p>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
        "
      >
        <img
          src="./assets/images/line-decoration-left.png"
          style="width: 15svh; height: auto"
        />
        <img
          src="./pattern-highfive-white.png"
          style="width: 24svh; height: 24svh"
        />
        <img
          src="./assets/images/line-decoration-right.png"
          style="width: 15svh; height: auto"
        />
      </div>
    </div>
    <script>
      let videoElement = document.getElementById("arsa-video");
      let pauseTimeout;
      let markerDetectedOnce = false;

      document.addEventListener("DOMContentLoaded", function () {
        const storiesElement = document.getElementById("stories");

        const friends = [
          {
            name: "Arsa",
            message:
              "Hi all! \n\nI hope this message finds you well. I wanted to take a moment to sincerely apologize for any misunderstandings or inconveniences I may have caused. Your friendship means the world to me, and I truly appreciate your kindness and support. Thank you for being such a wonderful friend.\n\nWarm regards,\nArsa",
            video: "./assets/videos/arsa.mp4",
          },
          {
            name: "Kojo",
            message:
              "Hi all!\n\nI hope you're doing great. I am writing to express my heartfelt apologies for any mistakes I might have made. Your friendship is incredibly valuable to me, and I am grateful for your patience and understanding. Thank you for being an amazing friend.\n\nBest wishes,\nKojo",
            video: "./assets/videos/kojo.mp4",
          },
        ];

        const colors = [
          "#EACA2A",
          "#EB579B",
          "#F77B29",
          "#FF3755",
          "#5EA0C6",
          "#92ED00",
        ];

        const showMessageButton = document.getElementById("showMessageButton");
        const messageModal = document.getElementById("messageModal");
        const modalMessage = document.getElementById("modalMessage");

        // Function to update video and message
        function updateContent(index) {
          videoElement.src = friends[index].video;
          videoElement.play();
        }

        // Initially hide the stories
        storiesElement.style.display = "none";

        // Set default video and message
        updateContent(0);

        document
          .querySelector("a-marker")
          .addEventListener("markerFound", function () {
            console.log("Marker is found");
            videoElement.play();
            if (pauseTimeout) {
              clearTimeout(pauseTimeout);
            }
            // Show the stories when the marker is found
            storiesElement.style.display = "flex";

            // Show the showMessageButton when the marker is found
            showMessageButton.style.display = "flex";

            // Hide the overlay when the marker is found
            const markerNotFoundOverlay = document.getElementById(
              "markerNotFoundOverlay"
            );
            if (!markerDetectedOnce) {
              markerNotFoundOverlay.style.transition = "opacity 0.5s ease";
              markerNotFoundOverlay.style.opacity = "0";
              setTimeout(() => {
                markerNotFoundOverlay.style.display = "none";
              }, 500); // Wait for the transition to complete
              markerDetectedOnce = true;
            }
          });

        document
          .querySelector("a-marker")
          .addEventListener("markerLost", function () {
            console.log("Marker is lost");
            pauseTimeout = setTimeout(() => {
              videoElement.pause();
              console.log("Video paused due to marker loss");
            }, 500); // Pause after 3 seconds
            // Hide the stories when the marker is lost
            storiesElement.style.display = "none";

            // Show the overlay when the marker is lost
            const markerNotFoundOverlay = document.getElementById(
              "markerNotFoundOverlay"
            );
            markerNotFoundOverlay.style.display = "block";

            // Hide the showMessageButton when the marker is lost
            showMessageButton.style.display = "none";
          });

        // Add click event listeners to story buttons and assign random border colors
        const storyButtons = document.querySelectorAll(".story-button");
        storyButtons.forEach((button, index) => {
          button.addEventListener("click", () => {
            updateContent(index);

            // Remove active class from all buttons
            storyButtons.forEach((btn) => btn.classList.remove("active"));

            // Add active class to the clicked button
            button.classList.add("active");
          });

          // Assign a random border color
          const randomColor = colors[Math.floor(Math.random() * colors.length)];
          button.style.border = `3px solid ${randomColor}`;
        });

        // Set the first story as active by default
        storyButtons[0].classList.add("active");

        // Show message modal if the active story is clicked
        showMessageButton.addEventListener("click", () => {
          const activeButton = document.querySelector(".story-button.active");
          if (activeButton) {
            const activeIndex = Array.from(storyButtons).indexOf(activeButton);
            modalMessage.innerHTML = friends[activeIndex].message.replace(
              /\n/g,
              "<br>"
            );
            messageModal.style.display = "flex";
          }
        });

        // Add event listener to close the modal when clicking on the overlay
        messageModal.addEventListener("click", (event) => {
          if (event.target === messageModal) {
            messageModal.style.display = "none";
          }
        });

        // Ensure the close button functionality remains
        const closeModalButton = document.getElementById("closeModalButton");
        closeModalButton.addEventListener("click", () => {
          messageModal.style.display = "none";
        });

        const swapCameraButton = document.getElementById("swapCameraButton");
        let currentStream;
        let videoDevices = [];
        let currentDeviceIndex = 0;

        // Function to get available video input devices
        async function getVideoDevices() {
          const devices = await navigator.mediaDevices.enumerateDevices();
          videoDevices = devices.filter(
            (device) => device.kind === "videoinput"
          );
          console.log("Available video devices:", videoDevices);
          if (videoDevices.length > 1) {
            swapCameraButton.style.display = "flex"; // Show the button if more than one camera
          } else {
            swapCameraButton.style.display = "none"; // Hide the button if only one camera
          }
        }

        // Function to switch camera
        async function switchCamera() {
          if (videoDevices.length > 1) {
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            const deviceId = videoDevices[currentDeviceIndex].deviceId;
            console.log(
              "Switched to camera:",
              videoDevices[currentDeviceIndex]
            );
            const constraints = {
              video: { deviceId: { exact: deviceId } },
            };
            if (currentStream) {
              currentStream.getTracks().forEach((track) => track.stop());
            }
            try {
              currentStream = await navigator.mediaDevices.getUserMedia(
                constraints
              );
              const aframeCamera = document.querySelector("a-entity[camera]");
              aframeCamera.setAttribute("camera", "active", false); // Deactivate current camera
              aframeCamera.setAttribute("camera", "active", true); // Reactivate with new stream
              aframeCamera.components.camera.camera.srcObject = currentStream; // Set new stream
              console.log;
            } catch (error) {
              console.error("Error switching camera:", error);
            }
          }
        }

        // Initialize video devices and add event listener for the button
        getVideoDevices();
        swapCameraButton.addEventListener("click", switchCamera);
      });

      const recordButton = document.getElementById("recordButton");
      const recordInner = document.getElementById("recordInner");
      let isRecording = false;

      recordButton.addEventListener("click", () => {
        isRecording = !isRecording;
        if (isRecording) {
          recordInner.style.borderRadius = "0";
          recordInner.style.width = "20px";
          recordInner.style.height = "20px";
        } else {
          recordInner.style.borderRadius = "50%";
          recordInner.style.width = "30px";
          recordInner.style.height = "30px";
        }
      });
    </script>
  </body>
</html>
