    <script>
      // Intercept getUserMedia BEFORE AR.js initializes to request maximum resolution
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = async function(constraints) {
          console.log('📹 getUserMedia called with constraints:', JSON.stringify(constraints, null, 2));
          
          if (constraints && constraints.video) {
            const modifiedConstraints = JSON.parse(JSON.stringify(constraints));
            
            if (typeof modifiedConstraints.video === 'object' && modifiedConstraints.video !== null) {
              // Remove any width/height limits to allow maximum resolution
              delete modifiedConstraints.video.width;
              delete modifiedConstraints.video.height;
              
              // Request maximum resolution by using ideal with very high values
              modifiedConstraints.video.width = { ideal: 4096, min: 1920 };
              modifiedConstraints.video.height = { ideal: 2160, min: 1080 };
              
              console.log('🔷 Modified constraints for max resolution:', JSON.stringify(modifiedConstraints, null, 2));
              
              try {
                const stream = await originalGetUserMedia(modifiedConstraints);
                const track = stream.getVideoTracks()[0];
                if (track) {
                  const settings = track.getSettings();
                  const capabilities = track.getCapabilities();
                  console.log('✅ Stream obtained - Resolution:', settings.width + 'x' + settings.height);
                  console.log('📊 Max Available Resolution:', 
                    (capabilities.width?.max || 'unknown') + 'x' + (capabilities.height?.max || 'unknown'));
                  
                  // Try to upgrade to maximum if we got less than max
                  if (capabilities.width?.max && capabilities.height?.max) {
                    const maxWidth = capabilities.width.max;
                    const maxHeight = capabilities.height.max;
                    
                    if (settings.width < maxWidth || settings.height < maxHeight) {
                      console.log(`🔄 Attempting to upgrade to max resolution: ${maxWidth}x${maxHeight}`);
                      try {
                        await track.applyConstraints({
                          width: { ideal: maxWidth },
                          height: { ideal: maxHeight }
                        });
                        const newSettings = track.getSettings();
                        console.log(`✅ Upgraded to: ${newSettings.width}x${newSettings.height}`);
                      } catch (upgradeErr) {
                        console.warn('⚠️ Could not upgrade to max resolution:', upgradeErr);
                      }
                    }
                  }
                }
                return stream;
              } catch (error) {
                console.warn('⚠️ Error with max resolution constraints, falling back to original:', error);
                // Fall back to original constraints if max resolution fails
                return originalGetUserMedia(constraints);
              }
            }
          }
          
          // No video constraints or video is just true - use original
          return originalGetUserMedia(constraints);
        };
        console.log('✅ getUserMedia interception set up for max resolution');
      }
    </script>

    <script>
      let videoElement = document.getElementById("arsa-video");
      let pauseTimeout;
      let markerDetectedOnce = false;
      let currentDeviceIndex = 0;
      let videoDevices = [];
      const muteButton = document.getElementById("muteButton");
      let currentStream;

      // Function to update video height based on aspect ratio
      function updateVideoHeight() {
        const videoPlane = document.querySelector("a-video");
        if (videoPlane && videoElement.videoWidth && videoElement.videoHeight) {
          const aspectRatio =
            videoElement.videoHeight / videoElement.videoWidth;
          const width = 1.8; // Keep width fixed
          const height = width * aspectRatio;
          videoPlane.setAttribute("height", height);
        }
      }

      // Function to update video width based on aspect ratio for sparkle marker
      function updateVideoWidth() {
        const videoPlanes = document.querySelectorAll("a-video");
        if (videoElement.videoWidth && videoElement.videoHeight) {
          const aspectRatio =
            videoElement.videoHeight / videoElement.videoWidth;
          const height = 5.3; // Keep height fixed for sparkle marker
          const width = height / aspectRatio;

          videoPlanes.forEach((plane) => {
            if (plane.getAttribute("width") === "6.3") {
              // Only update sparkle marker video
              plane.setAttribute("width", width);
            }
          });
        }
      }

      // Function to get URL parameters
      function getUrlParameter(name) {
        name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
        var regex = new RegExp("[\\?&]" + name + "=([^&#]*)");
        var results = regex.exec(location.search);
        return results === null
          ? ""
          : decodeURIComponent(results[1].replace(/\+/g, " ")).toUpperCase();
      }

      document.addEventListener("DOMContentLoaded", function () {
        // Load the video but keep it paused
        videoElement.load();
        videoElement.play();

        // Try to preload the video
        videoElement.addEventListener("loadedmetadata", function () {
          console.log("Video metadata loaded");
          updateVideoHeight();
          updateVideoWidth();
        });

        // Update dimensions when video source changes
        videoElement.addEventListener("loadeddata", function () {
          updateVideoHeight();
          updateVideoWidth();
        });

        const storiesElement = document.getElementById("stories");
        const orderID = getUrlParameter("orderID");
        console.log("Fetching content for orderID:", orderID);

        if (!orderID) {
          console.log("No orderID found, redirecting to base URL...");
          window.location.href =
            "https://moonmuffin.byc.plus/experience-app/ar";
          return;
        }

        // Fetch content from API
        fetch(`https://moonmuffin.byc.plus/api/gallery?order_id=${orderID}`)
          .then((response) => {
            console.log("API Response status:", response.status);
            return response.json();
          })
          .then((data) => {
            console.log("API Response data:", data);
            if (!data || data.length === 0) {
              console.log(
                "No data received, redirecting to order-specific URL..."
              );
              window.location.href = `https://moonmuffin.byc.plus/experience-app/ar/${orderID}`;
            return;
          }
          
            // Transform API data to match our stories structure
            const stories = data.map((item) => ({
              name: item.name,
              message: item.message,
              video: item.video_url,
              signature: item.signature_url,
            }));
            console.log("Transformed stories:", stories);
            console.log("First story:", stories[0]);
            console.log("Number of stories:", stories.length);

            // Update the stories UI
            storiesElement.innerHTML = ""; // Clear existing stories
            stories.forEach((story, index) => {
              const storyButton = document.createElement("div");
              storyButton.className = "story-button";
              storyButton.style.height = "60px";
              storyButton.style.minWidth = "60px";
              storyButton.style.backgroundColor = "#000";
              storyButton.style.borderRadius = "50%";
              storyButton.style.overflow = "hidden";
              // Store all story data
              storyButton.dataset.message = story.message;
              storyButton.dataset.video = story.video;
              storyButton.dataset.signature = story.signature;

              const video = document.createElement("video");
              video.src = story.video;
              video.loop = true;
              video.muted = true;
              video.autoplay = true;
              video.playsinline = true;
              video.setAttribute("webkit-playsinline", "true");
              video.setAttribute("x5-playsinline", "true");
              video.setAttribute("playsinline", "true");
              video.setAttribute("webkit-playsinline", "true");
              video.setAttribute("x5-playsinline", "true");
              video.setAttribute("x-webkit-airplay", "allow");
              video.setAttribute("x5-video-player-type", "h5");
              video.setAttribute("x5-video-player-fullscreen", "false");
              video.style.width = "100%";
              video.style.height = "100%";
              video.style.objectFit = "cover";

              storyButton.appendChild(video);
              storiesElement.appendChild(storyButton);

              // Add click event listener
              storyButton.addEventListener("click", () => {
              // Remove active class from all buttons
                document
                  .querySelectorAll(".story-button")
                  .forEach((btn) => btn.classList.remove("active"));
              // Add active class to clicked button
                storyButton.classList.add("active");
                // Update content immediately
                updateContent(index);
              });

              // Assign random border color
              const randomColor =
                colors[Math.floor(Math.random() * colors.length)];
              storyButton.style.border = `3px solid ${randomColor}`;
            });

            // Add plus button at the end
            const plusButton = document.createElement("div");
            plusButton.className = "story-button";
            plusButton.style.height = "60px";
            plusButton.style.minWidth = "60px";
            plusButton.style.backgroundColor = "#92ed00";
            plusButton.style.borderRadius = "50%";
            plusButton.style.display = "flex";
            plusButton.style.alignItems = "center";
            plusButton.style.justifyContent = "center";
            plusButton.style.cursor = "pointer";
            plusButton.style.border = "2px solid #046511";
            plusButton.innerHTML = `
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" fill="#046511"/>
              </svg>
            `;
            plusButton.addEventListener("click", () => {
              window.open(
                `https://moonmuffin.byc.plus/content/${orderID}`,
                "_blank"
              );
            });
            storiesElement.appendChild(plusButton);

            // Set first story as active by default
            const firstStoryButton =
              storiesElement.querySelector(".story-button");
            if (firstStoryButton) {
              firstStoryButton.classList.add("active");
              // Set initial signature
              const signatureImg = document.querySelector("#signatureImg");
              if (signatureImg && firstStoryButton.dataset.signature) {
                console.log(
                  "Setting initial signature URL:",
                  firstStoryButton.dataset.signature
                );
                signatureImg.src = firstStoryButton.dataset.signature;
                signatureImg.style.display = "block";
              }
            }

            // Set initial video source
            if (stories.length > 0) {
              videoElement.src = stories[0].video;
            }
          })
          .catch((error) => {
            console.error("Error fetching content:", error);
            // console.log("Redirecting due to error...");
            // window.location.href =
            //   "https://moonmuffin.byc.plus/experience-app/ar";
          });

        const colors = [
          "#EACA2A",
          "#EB579B",
          "#F77B29",
          "#FF3755",
          "#5EA0C6",
          "#92ED00",

        const showMessageButton = document.getElementById("showMessageButton");
        const messageModal = document.getElementById("messageModal");
        const modalMessage = document.getElementById("modalMessage");

        // Add the mute button to the right of the record button

              fill="#046511"

        // Function to update video and message
        function updateContent(index) {
          const activeButton = document.querySelector(".story-button.active");
          if (activeButton) {
            const video = activeButton.dataset.video;
            const message = activeButton.dataset.message;
            const signature = activeButton.dataset.signature;

            if (video) {
              videoElement.src = video;
              videoElement.play().catch((error) => {
                console.log("Error playing video:", error);
                if (error.name === "NotAllowedError") {
                  videoElement
                    .play()
                    .catch((e) =>
                      console.log("Even muted autoplay failed:", e)
                    );
            }
          });
        }

            // Update the signature dynamically
            const signatureImg = document.querySelector("#signatureImg");
            if (signatureImg) {
              if (signature && signature.trim() !== "") {
                console.log("Setting signature URL:", signature);
                signatureImg.src = signature;
                signatureImg.style.display = "block";
            } else {
                console.log(
                  "No signature URL available, hiding signature image"
                );
                signatureImg.style.display = "none";
                signatureImg.removeAttribute("src");
              }
            }
          }
        }

        // Initially hide the stories
        storiesElement.style.display = "none";

        // Initially hide the showMessageButton
        showMessageButton.style.display = "none";

        // Show message modal if the active story is clicked
        showMessageButton.addEventListener("click", () => {
          const activeButton = document.querySelector(".story-button.active");
          if (activeButton) {
            const message = activeButton.dataset.message;
            if (message) {
              modalMessage.innerHTML = message.replace(/\n/g, "<br>");
              messageModal.style.display = "flex";
              }
            }
          });

        // Add event listener to close the modal when clicking on the overlay
        messageModal.addEventListener("click", (event) => {
          if (event.target === messageModal) {
            messageModal.style.display = "none";
          }
        });

        // Ensure the close button functionality remains
        const closeModalButton = document.getElementById("closeModalButton");
        closeModalButton.addEventListener("click", () => {
          messageModal.style.display = "none";
        });

        const recordButton = document.getElementById("recordButton");
        const recordInner = document.getElementById("recordInner");
        let isRecording = false;

        recordButton.addEventListener("click", () => {
          isRecording = !isRecording;
          if (isRecording) {
            recordInner.style.borderRadius = "0";
            recordInner.style.width = "20px";
            recordInner.style.height = "20px";
              } else {
            recordInner.style.borderRadius = "50%";
            recordInner.style.width = "30px";
            recordInner.style.height = "30px";
          }
        });

        const galleryButton = document.getElementById("galleryButton");
        galleryButton.addEventListener("click", () => {
          window.location.href = `/gallery.html?orderID=${orderID.toUpperCase()}`;
        });

        // Add event listeners for both markers
        document.querySelectorAll("a-marker").forEach((marker) => {
          marker.addEventListener("markerFound", function () {
            console.log("Marker is found");
            // Ensure video is loaded and play it
            videoElement.load();
            const playPromise = videoElement.play();
            if (playPromise !== undefined) {
              playPromise.catch((error) => {
                console.log("Error playing video:", error);
                // If autoplay with unmute fails, try playing muted
                if (error.name === "NotAllowedError") {
                  videoElement.muted = true;
                  videoElement
                    .play()
                    .catch((e) =>
                      console.log("Even muted autoplay failed:", e)
                    );
                }
              });
            }
            if (pauseTimeout) {
              clearTimeout(pauseTimeout);
            }

            videoElement.muted = false; // Unmute when marker is detected
            videoElement.volume = 1; // Set volume to maximum
            // Show the stories when the marker is found
            storiesElement.style.display = "flex";

            // Show the showMessageButton when the marker is found
            showMessageButton.style.display = "flex";

            // Hide the overlay when the marker is found
            const markerNotFoundOverlay = document.getElementById(
              "markerNotFoundOverlay"
            );
            if (!markerDetectedOnce) {
              markerNotFoundOverlay.style.transition = "opacity 0.5s ease";
              markerNotFoundOverlay.style.opacity = "0";
              setTimeout(() => {
                markerNotFoundOverlay.style.display = "none";
              }, 500); // Wait for the transition to complete
              markerDetectedOnce = true;
            }
          });

          marker.addEventListener("markerLost", function () {
            console.log("Marker is lost");
            pauseTimeout = setTimeout(() => {
              videoElement.pause();
              console.log("Video and audio paused due to marker loss");
            }, 500); // Pause after 3 seconds
            // Hide the stories when the marker is lost
            storiesElement.style.display = "none";

            // Show the overlay when the marker is lost
            const markerNotFoundOverlay = document.getElementById(
              "markerNotFoundOverlay"
            );
            markerNotFoundOverlay.style.display = "block";

            // Hide the showMessageButton when the marker is lost
            showMessageButton.style.display = "none";
          });
        });
      });

      window.addEventListener("beforeunload", () => {
        const videoElement = document.getElementById("arsa-video");
        if (videoElement) {
          videoElement.pause();
        }
      });
    </script>
