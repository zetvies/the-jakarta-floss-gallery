  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script>
    // Intercept getUserMedia BEFORE AR.js initializes to request maximum resolution
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = async function (constraints) {
        console.log('📹 getUserMedia called with constraints:', JSON.stringify(constraints, null, 2));

        if (constraints && constraints.video) {
          const modifiedConstraints = JSON.parse(JSON.stringify(constraints));

          if (typeof modifiedConstraints.video === 'object' && modifiedConstraints.video !== null) {
            // Remove any width/height limits to allow maximum resolution
            delete modifiedConstraints.video.width;
            delete modifiedConstraints.video.height;

            // Request maximum resolution by using ideal with very high values
            modifiedConstraints.video.width = { ideal: 4096 };
            modifiedConstraints.video.height = { ideal: 2160 };

            console.log('🔷 Modified constraints for max resolution:', JSON.stringify(modifiedConstraints, null, 2));

            try {
              const stream = await originalGetUserMedia(modifiedConstraints);
              const track = stream.getVideoTracks()[0];
              if (track) {
                const settings = track.getSettings();
                const capabilities = track.getCapabilities();
                console.log('✅ Stream obtained - Resolution:', settings.width + 'x' + settings.height);
                console.log('📊 Max Available Resolution:',
                  (capabilities.width?.max || 'unknown') + 'x' + (capabilities.height?.max || 'unknown'));

                // Try to upgrade to maximum if we got less than max
                if (capabilities.width?.max && capabilities.height?.max) {
                  const maxWidth = capabilities.width.max;
                  const maxHeight = capabilities.height.max;

                  if (settings.width < maxWidth || settings.height < maxHeight) {
                    console.log(`🔄 Attempting to upgrade to max resolution: ${maxWidth}x${maxHeight}`);
                    try {
                      await track.applyConstraints({
                        width: { ideal: maxWidth },
                        height: { ideal: maxHeight }
                      });
                      const newSettings = track.getSettings();
                      console.log(`✅ Upgraded to: ${newSettings.width}x${newSettings.height}`);
                    } catch (upgradeErr) {
                      console.warn('⚠️ Could not upgrade to max resolution:', upgradeErr);
                    }
                  }
                }
              }
              return stream;
            } catch (error) {
              console.warn('⚠️ Error with max resolution constraints, falling back to original:', error);
              // Fall back to original constraints if max resolution fails
              return originalGetUserMedia(constraints);
            }
          }
        }

        // No video constraints or video is just true - use original
        return originalGetUserMedia(constraints);
      };
      console.log('✅ getUserMedia interception set up for max resolution');
    }
  </script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.7.7/aframe/build/aframe-ar.js"></script>
  <script>
    // Custom component to resize image based on aspect ratio while fitting within max dimensions
    AFRAME.registerComponent('resize-on-load', {
      init: function () {
        const handleResize = (evt) => {
          const texture = evt.detail ? evt.detail.texture : null;
          const image = texture ? texture.image : null;
          
          // Safari fallback: try to get image from material
          if (!image && this.el.components && this.el.components.material) {
            const material = this.el.components.material.material;
            if (material && material.map && material.map.image) {
              const img = material.map.image;
              const width = img.width || img.naturalWidth;
              const height = img.height || img.naturalHeight;
              if (width && height) {
                const ratio = width / height;
                const maxWidth = 1.5;
                const maxHeight = 3;

                let newWidth = maxWidth;
                let newHeight = newWidth / ratio;

                if (newHeight > maxHeight) {
                  newHeight = maxHeight;
                  newWidth = newHeight * ratio;
                }

                this.el.setAttribute('width', newWidth);
                this.el.setAttribute('height', newHeight);
                return;
              }
            }
          }
          
          if (!image) return;

          const width = image.width || image.naturalWidth;
          const height = image.height || image.naturalHeight;
          if (!width || !height) return;

          const ratio = width / height;
          const maxWidth = 1.5;
          const maxHeight = 3;

          let newWidth = maxWidth;
          let newHeight = newWidth / ratio;

          // If calculated height exceeds max height, scale down by height instead
          if (newHeight > maxHeight) {
            newHeight = maxHeight;
            newWidth = newHeight * ratio;
          }

          this.el.setAttribute('width', newWidth);
          this.el.setAttribute('height', newHeight);
        };
        
        // Safari compatibility: Listen to multiple events
        this.el.addEventListener('materialtextureloaded', handleResize);
        this.el.addEventListener('loaded', handleResize);
        this.el.addEventListener('materialchanged', handleResize);
        
        // Safari fallback: Check after multiple delays (Safari loads textures asynchronously)
        setTimeout(() => {
          if (this.el.components && this.el.components.material) {
            const material = this.el.components.material.material;
            if (material && material.map && material.map.image) {
              handleResize({ detail: { texture: { image: material.map.image } } });
            }
          }
        }, 500);
        
        // Additional Safari check after longer delay
        setTimeout(() => {
          if (this.el.components && this.el.components.material) {
            const material = this.el.components.material.material;
            if (material && material.map && material.map.image) {
              handleResize({ detail: { texture: { image: material.map.image } } });
            }
          }
        }, 1500);
      }
    });

    // Custom component for smooth, slow, irregular character animation
    AFRAME.registerComponent('character-animation', {
      schema: {
        rotationSpeed: { type: 'number', default: 1 },
        translationSpeed: { type: 'number', default: 1 },
        zAmplitude: { type: 'number', default: 0.2 },
        yAmplitude: { type: 'number', default: 0.2 }
      },
      init: function () {
        // Store initial position
        const initialPos = this.el.getAttribute('position');
        this.initialZ = initialPos.z || 0;
        this.initialY = initialPos.y || 0;

        // Store initial rotation
        const initialRot = this.el.getAttribute('rotation');
        this.initialRotationY = initialRot.y || 0;

        // Random offsets for irregular movement (different for each character)
        this.timeOffset = Math.random() * Math.PI * 2; // Random phase
        this.zPhase = Math.random() * Math.PI * 2;
        this.yPhase = Math.random() * Math.PI * 2;
        this.rotationPhase = Math.random() * Math.PI * 2;

        // Different frequencies for irregular movement
        this.zFreq = 0.3 + Math.random() * 0.2; // 0.3 to 0.5
        this.yFreq = 0.25 + Math.random() * 0.15; // 0.25 to 0.4
        this.rotationFreq = 0.2 + Math.random() * 0.1; // 0.2 to 0.3

        // Random rotation range (different for each character)
        this.rotationRange = 10 + Math.random() * 20; // 10 to 30 degrees

        this.startTime = Date.now();
      },
      tick: function (time, timeDelta) {
        const elapsed = (time - this.startTime) / 1000; // Convert to seconds

        // Smooth, slow rotation on Y-axis with irregular pattern
        const rotationTime = elapsed * this.data.rotationSpeed * this.rotationFreq + this.rotationPhase;
        // Use sine wave with slight variation for irregularity
        const rotationOffset = Math.sin(rotationTime) * this.rotationRange +
          Math.sin(rotationTime * 1.7) * (this.rotationRange * 0.3);
        const newRotationY = this.initialRotationY + rotationOffset;

        // Smooth, slow translation in Z and Y with irregular pattern
        const zTime = elapsed * this.data.translationSpeed * this.zFreq + this.zPhase;
        const yTime = elapsed * this.data.translationSpeed * this.yFreq + this.yPhase;

        // Use sine waves with multiple frequencies for irregular, smooth movement
        const zOffset = Math.sin(zTime) * this.data.zAmplitude +
          Math.sin(zTime * 1.5) * (this.data.zAmplitude * 0.4) +
          Math.sin(zTime * 2.3) * (this.data.zAmplitude * 0.2);

        const yOffset = Math.sin(yTime) * this.data.yAmplitude +
          Math.sin(yTime * 1.3) * (this.data.yAmplitude * 0.5) +
          Math.sin(yTime * 2.1) * (this.data.yAmplitude * 0.3);

        // Apply rotation
        const currentRotation = this.el.getAttribute('rotation');
        this.el.setAttribute('rotation', {
          x: currentRotation.x,
          y: newRotationY,
          z: currentRotation.z
        });

        // Apply translation
        const currentPosition = this.el.getAttribute('position');
        this.el.setAttribute('position', {
          x: currentPosition.x,
          y: this.initialY + yOffset,
          z: this.initialZ + zOffset
        });
      }
    });
  </script>
</head>

  <a-scene style="z-index: 1" embedded arjs="debugUIEnabled: false; patternRatio: 0.7; sourceType: webcam;"
    device-orientation-permission-ui="enabled: false" vr-mode-ui="enabled: false">
    <!-- Define markers - images will be generated dynamically -->
    <a-marker type="pattern" url="pattern-confetti-final.patt"></a-marker>
    <a-marker type="pattern" url="pattern-smiley-final.patt"></a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Function to generate trapezium grid of images for a marker
    // Fills from center outward: middle, left, right, outer left, outer right, etc.
    function generateImageGrid(marker, dataArray, xOffset = 0) {
      // Grid configuration
      const width = 1.5; // 1.5x bigger (was 1)
      const height = 3; // 1.5x bigger (was 2)
      const xSpacing = width; // 1x the size (spacing equals width)
      // Alternative: const xSpacing = width * 0.5; // 0.5x the size
      const zIncrement = 0.3; // Z increments by 0.3
      const yIncrement = 1.0; // Y increments by 1

      // Calculate trapezium structure
      // Row 1: 4 images, Row 2: 5 images, Row 3: 6 images, etc.
      function getRowSize(rowIndex) {
        return 4 + rowIndex; // Row 0 = 4, Row 1 = 5, Row 2 = 6, etc.
      }

      // Generate fill order: center, left, right, outer left, outer right, etc.
      // Fills each row completely before moving to next row
      function getFillOrder(rowIndex, rowSize) {
        const order = [];

        if (rowSize % 2 === 1) {
          // Odd number of items: single center
          const centerIndex = Math.floor(rowSize / 2);
          order.push(centerIndex); // Start with center

          // Then fill outward: left, right, outer left, outer right, etc.
          for (let offset = 1; offset <= centerIndex; offset++) {
            // Left side (closer to center first)
            if (centerIndex - offset >= 0) {
              order.push(centerIndex - offset);
            }
            // Right side (closer to center first)
            if (centerIndex + offset < rowSize) {
              order.push(centerIndex + offset);
            }
          }
        } else {
          // Even number of items: two center positions
          const leftCenter = Math.floor(rowSize / 2) - 1;
          const rightCenter = Math.floor(rowSize / 2);

          // Start with left center, then right center
          order.push(leftCenter);
          order.push(rightCenter);

          // Then fill outward: left, right, outer left, outer right, etc.
          for (let offset = 1; offset < rowSize / 2; offset++) {
            // Left side
            if (leftCenter - offset >= 0) {
              order.push(leftCenter - offset);
            }
            // Right side
            if (rightCenter + offset < rowSize) {
              order.push(rightCenter + offset);
            }
          }
        }

        return order;
      }

      // Calculate which row and position for each item
      let itemIndex = 0;
      let currentRow = 0;
      let currentRowPosition = 0;
      let currentRowSize = getRowSize(currentRow);
      let currentRowFillOrder = getFillOrder(currentRow, currentRowSize);

      // Y variations for slight randomness (reuse pattern)
      const yVariationPattern = [0.05, -0.08, 0.12, -0.05, 0.08, 0.12, -0.05, 0.08, -0.08, 0.15];

      for (let i = 0; i < dataArray.length; i++) {
        const data = dataArray[i];

        // Get position in current row's fill order
        const colInFillOrder = currentRowFillOrder[currentRowPosition];

        // Calculate X position (center is 0, left is negative, right is positive)
        // Apply xOffset to shift the entire grid, plus one character width to the right
        const x = ((colInFillOrder - Math.floor(currentRowSize / 2)) * xSpacing) + xOffset + width;

        // Calculate Z and Y positions
        const baseZ = currentRow * zIncrement;
        const baseY = currentRow * yIncrement;
        const yVariation = yVariationPattern[itemIndex % yVariationPattern.length];
        const y = baseY + yVariation;
        const z = baseZ;

        // Get image source from data or default
        const faceSrc = data.src || data.image || `/assets/face-${((itemIndex % 4) + 1)}.png`;

        // Create image element
        const imageEl = document.createElement('a-image');
        
        // Set attributes first
        imageEl.setAttribute('width', width);
        imageEl.setAttribute('height', height);
        imageEl.setAttribute('position', `${x} ${y} ${z}`);
        imageEl.setAttribute('rotation', '-90 0 0');
        imageEl.setAttribute('character-animation', '');
        imageEl.setAttribute('resize-on-load', '');

        // Add material properties to prevent overlap glitches
        // Safari compatibility: Use explicit material settings
        imageEl.setAttribute('material', {
          transparent: true,
          alphaTest: 0.1, // Discard pixels with alpha < 0.1 to prevent transparent part glitches
          depthTest: true,
          depthWrite: true,
          side: 'double', // Render both sides to prevent flickering
          shader: 'flat' // Use flat shader for better Safari compatibility
        });

        // Store any additional data attributes
        if (data.id) imageEl.setAttribute('data-id', data.id);
        if (data.class) imageEl.setAttribute('class', data.class);

        // Safari compatibility: Preload image and ensure it loads before setting src
        const img = new Image();
        
        // Try with CORS first, fallback to no CORS if it fails
        img.crossOrigin = 'anonymous';
        
        // Safari fix: Wait for image to load before setting src on a-image
        const loadImage = () => {
          return new Promise((resolve, reject) => {
            img.onload = () => {
              // Set src after image is loaded (Safari needs this)
              imageEl.setAttribute('src', faceSrc);
              
              // Safari fix: Force material and texture update after image loads
              setTimeout(() => {
                if (imageEl.components && imageEl.components.material) {
                  // Force material update
                  imageEl.components.material.updateProperties();
                  
                  // Force texture refresh for Safari
                  const material = imageEl.components.material.material;
                  if (material && material.map) {
                    material.map.needsUpdate = true;
                  }
                }
                
                // Force scene render update for Safari
                const scene = document.querySelector('a-scene');
                if (scene && scene.renderer && scene.object3D && scene.camera) {
                  scene.renderer.render(scene.object3D, scene.camera);
                }
              }, 50);
              
              resolve();
            };
            
            img.onerror = () => {
              // If CORS fails, try without CORS
              if (img.crossOrigin === 'anonymous') {
                console.warn(`CORS failed for ${faceSrc}, retrying without CORS`);
                const imgRetry = new Image();
                imgRetry.onload = () => {
                  imageEl.setAttribute('src', faceSrc);
                  setTimeout(() => {
                    if (imageEl.components && imageEl.components.material) {
                      imageEl.components.material.updateProperties();
                      const material = imageEl.components.material.material;
                      if (material && material.map) {
                        material.map.needsUpdate = true;
                      }
                    }
                    const scene = document.querySelector('a-scene');
                    if (scene && scene.renderer && scene.object3D && scene.camera) {
                      scene.renderer.render(scene.object3D, scene.camera);
                    }
                  }, 50);
                  resolve();
                };
                imgRetry.onerror = () => {
                  console.error(`Failed to load image: ${faceSrc}`);
                  // Still add the element, it might work
                  imageEl.setAttribute('src', faceSrc);
                  resolve();
                };
                imgRetry.src = faceSrc;
              } else {
                console.error(`Failed to load image: ${faceSrc}`);
                // Still add the element, it might work
                imageEl.setAttribute('src', faceSrc);
                resolve();
              }
            };
            
            img.src = faceSrc;
          });
        };

        // Add element to marker first (Safari needs DOM element before texture loads)
        marker.appendChild(imageEl);
        
        // Load image asynchronously
        loadImage().catch(err => {
          console.error(`Error loading image ${faceSrc}:`, err);
          // Still try to set src
          imageEl.setAttribute('src', faceSrc);
        });

        // Move to next position
        itemIndex++;
        currentRowPosition++;

        // Check if we need to move to next row
        if (currentRowPosition >= currentRowSize) {
          currentRow++;
          currentRowPosition = 0;
          currentRowSize = getRowSize(currentRow);
          currentRowFillOrder = getFillOrder(currentRow, currentRowSize);
        }
      }
    }

    // Generate images for all markers when scene is ready
    // dataArray: Array of objects with photo_url or src property from Supabase/API
    function initializeImageGrids(dataArray = null) {
      const markers = document.querySelectorAll('a-marker');

      if (markers.length > 0) {
        markers.forEach(function (marker) {
          // Clear any existing children first
          while (marker.firstChild) {
            marker.removeChild(marker.firstChild);
          }

          // Determine X offset based on marker pattern
          let xOffset = 0;
          const markerUrl = marker.getAttribute('url');
          let targetContainer = marker;

          if (markerUrl === 'pattern-ribbon-final.patt') {
            xOffset = -2; // Shift ribbon marker left by 2 units
          } else if (markerUrl === 'pattern-smiley-final.patt') {
            xOffset = -1; // Shift smiley marker left by 1 unit
          } else if (markerUrl === 'pattern-confetti-final.patt') {
            // Create wrapper for confetti transformations
            const wrapper = document.createElement('a-entity');
            // Move left 3, bottom 3.5. Rotate 60deg right (yaw -60)
            wrapper.setAttribute('position', '-5, 0, 4.5');
            wrapper.setAttribute('rotation', '0 0 -60');

            marker.appendChild(wrapper);
            targetContainer = wrapper;
          }

          // Use API data if available, otherwise fall back to static images
          let imageData = [];

          if (dataArray && dataArray.length > 0) {
            // Filter items that have photo_url
            const validItems = dataArray.filter(item => item.photo_url && item.photo_url.trim() !== '');

            if (validItems.length > 0) {
              // Use actual data from API/Supabase - use exact number of items
              imageData = validItems.map((item, index) => ({
                id: item.id || index + 1,
                src: item.photo_url,
                name: item.name || '',
                message: item.message || ''
              }));
              console.log(`✅ Using ${validItems.length} images from API/Supabase for AR content (exact count)`);
            } else {
              // No valid images in API data, do nothing or log
              console.log('⚠️ No valid photo_url in API data, showing clear scene');
            }
          } else {
            // No data provided, do nothing or log
            console.log('⚠️ No API data provided, showing clear scene');
          }

          generateImageGrid(targetContainer, imageData, xOffset);
          
          // Safari fix: Force scene render update after adding images
          const scene = document.querySelector('a-scene');
          if (scene) {
            // Multiple timeouts to ensure Safari renders properly
            setTimeout(() => {
              if (scene.renderer && scene.object3D && scene.camera) {
                scene.renderer.render(scene.object3D, scene.camera);
              }
              // Force material updates for all images
              const images = targetContainer.querySelectorAll('a-image');
              images.forEach(img => {
                if (img.components && img.components.material) {
                  img.components.material.updateProperties();
                  // Force texture update for Safari
                  const material = img.components.material.material;
                  if (material && material.map) {
                    material.map.needsUpdate = true;
                  }
                }
              });
            }, 500);
            
            // Additional Safari fix: Force another render after a longer delay
            setTimeout(() => {
              if (scene.renderer && scene.object3D && scene.camera) {
                scene.renderer.render(scene.object3D, scene.camera);
              }
              const images = targetContainer.querySelectorAll('a-image');
              images.forEach(img => {
                if (img.components && img.components.material) {
                  const material = img.components.material.material;
                  if (material && material.map) {
                    material.map.needsUpdate = true;
                  }
                  // Force component update
                  img.components.material.updateProperties();
                }
              });
            }, 1500);
          }
        });
        console.log('✅ Generated trapezium image grids for', markers.length, 'markers');
      } else {
        console.warn('⚠️ No markers found, retrying...');
        setTimeout(() => initializeImageGrids(dataArray), 100);
      }
    }

    // Try multiple initialization methods
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () {
        const scene = document.querySelector('a-scene');
        if (scene && scene.hasLoaded) {
          initializeImageGrids();
        } else {
          scene.addEventListener('loaded', initializeImageGrids);
          // Fallback timeout
          setTimeout(initializeImageGrids, 1000);
        }
      });
    } else {
      // DOM already loaded
      const scene = document.querySelector('a-scene');
      if (scene && scene.hasLoaded) {
        initializeImageGrids();
      } else {
        if (scene) {
          scene.addEventListener('loaded', initializeImageGrids);
        }
        // Fallback timeout
        setTimeout(initializeImageGrids, 1000);
      }
    }
  </script>

  <script>
    let videoElement = document.getElementById("arsa-video");
    let pauseTimeout;
    let markerDetectedOnce = false;
    let currentDeviceIndex = 0;
    let videoDevices = [];
    const muteButton = document.getElementById("muteButton");
    let currentStream;

    // Function to update video height based on aspect ratio
    function updateVideoHeight() {
      const videoPlane = document.querySelector("a-video");
      if (videoPlane && videoElement.videoWidth && videoElement.videoHeight) {
        const aspectRatio =
          videoElement.videoHeight / videoElement.videoWidth;
        const width = 1.8; // Keep width fixed
        const height = width * aspectRatio;
        videoPlane.setAttribute("height", height);
      }
    }

    // Function to update video width based on aspect ratio for sparkle marker
    function updateVideoWidth() {
      const videoPlanes = document.querySelectorAll("a-video");
      if (videoElement.videoWidth && videoElement.videoHeight) {
        const aspectRatio =
          videoElement.videoHeight / videoElement.videoWidth;
        const height = 5.3; // Keep height fixed for sparkle marker
        const width = height / aspectRatio;

        videoPlanes.forEach((plane) => {
          if (plane.getAttribute("width") === "6.3") {
            // Only update sparkle marker video
            plane.setAttribute("width", width);
          }
        });
      }
    }

    // Function to get URL parameters
    function getUrlParameter(name) {
      name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
      var regex = new RegExp("[\\?&]" + name + "=([^&#]*)");
      var results = regex.exec(location.search);
      return results === null
        ? ""
        : decodeURIComponent(results[1].replace(/\+/g, " ")).toUpperCase();
    }

    // Cache for preloaded assets
    const assetCache = {
      images: new Map(),
      audio: new Map()
    };

    // Function to preload image
    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        if (assetCache.images.has(src)) {
          resolve(assetCache.images.get(src));
          return;
        }

        const img = new Image();
        img.onload = () => {
          assetCache.images.set(src, img);
          resolve(img);
        };
        img.onerror = () => reject(new Error(`Failed to load image: ${src}`));
        img.src = src;
      });
    }

    // Function to preload audio/video
    function preloadAudio(src) {
      return new Promise((resolve, reject) => {
        if (assetCache.audio.has(src)) {
          resolve(assetCache.audio.get(src));
          return;
        }

        const audio = new Audio();
        audio.preload = 'auto';
        audio.oncanplaythrough = () => {
          assetCache.audio.set(src, audio);
          resolve(audio);
        };
        audio.onerror = () => reject(new Error(`Failed to load audio: ${src}`));
        audio.src = src;
        audio.load();
      });
    }

    // Preload all content assets on page load
    function preloadContentAssets(contentData) {
      const validItems = contentData.filter(item =>
        item.photo_url && item.photo_url.trim() !== ''
      );

      if (validItems.length === 0) {
        console.log('No valid items to preload');
        return;
      }

      console.log(`📥 Preloading ${validItems.length} assets...`);

      // Preload all images and audio
      const preloadPromises = [];

      for (let i = 0; i < validItems.length; i++) {
        const item = validItems[i];

        // Preload image
        if (item.photo_url && item.photo_url.trim() !== '') {
          preloadPromises.push(
            preloadImage(item.photo_url)
              .then(() => console.log(`✅ Image ${i + 1}/${validItems.length} preloaded`))
              .catch((error) => console.warn(`⚠️ Image ${i + 1} failed to preload:`, error))
          );
        }

        // Preload audio (prefer audio_url, fallback to video_url)
        const audioUrl = item.audio_url || item.video_url || '';
        if (audioUrl && audioUrl.trim() !== '') {
          preloadPromises.push(
            preloadAudio(audioUrl)
              .then(() => console.log(`✅ Audio ${i + 1}/${validItems.length} preloaded`))
              .catch((error) => console.warn(`⚠️ Audio ${i + 1} failed to preload:`, error))
          );
        }
      }

      // Wait for all assets to load (don't block, just log progress)
      Promise.allSettled(preloadPromises).then(() => {
        console.log('✅ All assets preloaded and cached');
      });
    }

    // Global state for slideshow
    const slideshowState = {
      currentIndex: 0,
      isRightSide: true,
      validItems: [],
      isRunning: false,
      timeout: null,
      runId: 0,
      isMuted: false
    };

    // Helper functions exposed globally
    window.pauseSlideshow = function () {
      console.log('Pausing slideshow...');
      slideshowState.isRunning = false;

      if (slideshowState.timeout) {
        clearTimeout(slideshowState.timeout);
        slideshowState.timeout = null;
      }

      const contentAudio = document.getElementById('content-audio');
      if (contentAudio) {
        contentAudio.pause();
        contentAudio.currentTime = 0;
      }

      const leftImage = document.getElementById('top-left-image');
      const rightImage = document.getElementById('top-right-image');

      if (leftImage) leftImage.style.left = '-50svh';
      if (rightImage) rightImage.style.right = '-50svh';
    };

    window.resumeSlideshowNext = function () {
      console.log('Resuming slideshow from next item...');
      if (!window.sequentialContentData) return;

      slideshowState.isRunning = true;
      slideshowState.runId++; // Invalidates any previous pending async calls

      // Move to next item immediately
      slideshowState.currentIndex++;
      slideshowState.isRightSide = !slideshowState.isRightSide;

      showNextImage();
    };

    // Core slideshow logic
    async function showNextImage() {
      // Capture current runId
      const thisRunId = slideshowState.runId;

      if (!slideshowState.isRunning || slideshowState.validItems.length === 0) return;

      // Reset index if out of bounds
      if (slideshowState.currentIndex >= slideshowState.validItems.length) {
        console.log('All images displayed, looping after 15s...');
        slideshowState.timeout = setTimeout(() => {
          if (slideshowState.isRunning && slideshowState.runId === thisRunId) {
            slideshowState.currentIndex = 0;
            // Don't reset isRightSide, let it alternate naturally
            showNextImage();
          }
        }, 15000);
        return;
      }


      // Wrap index around if modified externally to be very large, or handle as above
      // The above logic handles "end of list", but if we want infinite loop immediately after closing:
      if (slideshowState.currentIndex >= slideshowState.validItems.length) {
        slideshowState.currentIndex = 0; // Just in case resumeSlideshowNext pushed it over
      }


      const item = slideshowState.validItems[slideshowState.currentIndex];
      const leftImage = document.getElementById('top-left-image');
      const rightImage = document.getElementById('top-right-image');
      const contentAudio = document.getElementById('content-audio');

      if (!leftImage || !rightImage || !contentAudio) return;

      const currentImage = slideshowState.isRightSide ? rightImage : leftImage;
      const audioUrl = item.audio_url || item.video_url || '';

      // Preload
      try {
        await preloadImage(item.photo_url);
      } catch (e) {
        console.warn('Preload failed', e);
      }

      currentImage.src = item.photo_url;

      // Wait for image load
      await new Promise(resolve => {
        if (currentImage.complete) resolve();
        else {
          currentImage.onload = resolve;
          currentImage.onerror = resolve;
        }
      });

      if (slideshowState.runId !== thisRunId) return; // Check concurrency


      if (audioUrl && audioUrl.trim() !== '') {
        try { await preloadAudio(audioUrl); } catch (e) { }


        contentAudio.src = audioUrl;
        contentAudio.muted = slideshowState.isMuted;
        contentAudio.volume = 1.0;
        contentAudio.load();

        // Wait for audio ready
        await new Promise(resolve => {
          if (contentAudio.readyState >= 3) resolve();
          else {
            const h = () => {
              contentAudio.removeEventListener('canplay', h);
              resolve();
            };
            contentAudio.addEventListener('canplay', h);
            setTimeout(() => {
              contentAudio.removeEventListener('canplay', h);
              resolve();
            }, 5000);
          }
        });

        if (slideshowState.runId !== thisRunId) return; // Check concurrency

        if (!slideshowState.isRunning) return; // Check again in case paused during await

        // Show
        if (slideshowState.isRightSide) rightImage.style.right = '-5svh';
        else leftImage.style.left = '-5svh';

        console.log(`Showing image ${slideshowState.currentIndex + 1}`);

        contentAudio.play().then(() => {
          const onEnded = () => {
            contentAudio.removeEventListener('ended', onEnded);

            // Hide
            if (slideshowState.isRightSide) rightImage.style.right = '-50svh';
            else leftImage.style.left = '-50svh';

            slideshowState.timeout = setTimeout(() => {
              if (slideshowState.isRunning && slideshowState.runId === thisRunId) {
                slideshowState.currentIndex++;
                slideshowState.isRightSide = !slideshowState.isRightSide;
                showNextImage();
              }
            }, 3000);
          };
          contentAudio.addEventListener('ended', onEnded, { once: true });
        }).catch(e => {
          console.error('Audio play error', e);
          // Fallback
          slideshowState.timeout = setTimeout(() => {
            if (slideshowState.isRightSide) rightImage.style.right = '-50svh';
            else leftImage.style.left = '-50svh';

            slideshowState.timeout = setTimeout(() => {
              if (slideshowState.isRunning && slideshowState.runId === thisRunId) {
                slideshowState.currentIndex++;
                slideshowState.isRightSide = !slideshowState.isRightSide;
                showNextImage();
              }
            }, 3000);
          }, 3000);
        });
      } else {
        // No audio
        if (slideshowState.runId !== thisRunId) return; // Check concurrency
        if (!slideshowState.isRunning) return;

        if (slideshowState.isRightSide) rightImage.style.right = '-5svh';
        else leftImage.style.left = '-5svh';

        setTimeout(() => {
          // Check runId again before hiding/proceeding? 
          if (slideshowState.runId !== thisRunId || !slideshowState.isRunning) {
            // If interrupted, ensure we hide images if they were shown by this run
            return;
          }

          if (slideshowState.isRightSide) rightImage.style.right = '-50svh';
          else leftImage.style.left = '-50svh';

          slideshowState.timeout = setTimeout(() => {
            if (slideshowState.isRunning && slideshowState.runId === thisRunId) {
              slideshowState.currentIndex++;
              slideshowState.isRightSide = !slideshowState.isRightSide;
              showNextImage();
            }
          }, 3000);
        }, 3000);
      }
    }

    // Function to start sequential image display with audio
    function startSequentialImageDisplay(contentData) {
      if (slideshowState.isRunning) return; // Already running

      // Filter items that have photo_url
      const newValidItems = contentData.filter(item =>
        item.photo_url && item.photo_url.trim() !== ''
      );

      if (newValidItems.length === 0) {
        console.log('No valid items with photo_url for sequential display');
        return;
      }

      slideshowState.validItems = newValidItems;

      const leftImage = document.getElementById('top-left-image');
      const rightImage = document.getElementById('top-right-image');
      const contentAudio = document.getElementById('content-audio');

      if (!leftImage || !rightImage || !contentAudio) {
        console.error('Required elements not found for sequential display');
        return;
      }

      // Initialize both images to be outside
      leftImage.style.left = '-50svh';
      rightImage.style.right = '-50svh';

      // Resume from previous state if possible, otherwise reset
      // We check if currentIndex is within bounds.
      if (slideshowState.currentIndex >= slideshowState.validItems.length) {
        slideshowState.currentIndex = 0;
      }
      // Note: We do NOT reset isRightSide, to preserve pattern continuity
      // But if it's the very first run (runId 0), we might ensure defaults?
      // slideshowState.runId is initialized to 0. 
      if (slideshowState.runId === 0 && slideshowState.currentIndex === 0) {
        slideshowState.isRightSide = true;
      }

      slideshowState.isRunning = true;
      slideshowState.runId++;

      showNextImage();
    }

    // Function to render letters in horizontal story list (circular buttons with letter SVGs)
    async function renderLettersBottomLeft(lettersData) {
      console.log('renderLettersBottomLeft called with data:', lettersData);
      const lettersListBottom = document.getElementById('letters-list-bottom');
      if (!lettersListBottom) {
        console.error('letters-list-bottom element not found');
        return;
      }

      // Setup scrollbar visibility on scroll (only once)
      if (!lettersListBottom.dataset.scrollbarSetup) {
        let scrollTimeout;
        lettersListBottom.addEventListener('scroll', () => {
          lettersListBottom.classList.add('scrolling');
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => {
            lettersListBottom.classList.remove('scrolling');
          }, 1000); // Hide scrollbar 1 second after scrolling stops
        });
        lettersListBottom.dataset.scrollbarSetup = 'true';
      }

      // Clear existing letters
      lettersListBottom.innerHTML = '';

      if (!lettersData || lettersData.length === 0) {
        console.log('No letters data to render');
        return;
      }

      console.log('Rendering', lettersData.length, 'letters');

      // Import createSVGComponent dynamically
      const { createSVGComponent } = await import('./svg-component.js');

      // Color palette for sequential assignment
      const colorPalette = [
        '90FF77',
        'FF5627',
        '008177',
        'FFC61C',
        'FF443D',
        '8142FF',
        '28B7FF',
        'FF7ADC'
      ];

      lettersData.forEach((letter, i) => {
        // Create unique ID for filter IDs
        const uniqueId = `letter_story_${i}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

        // Get sequential color from palette
        const colorIndex = i % colorPalette.length;
        const selectedColor = colorPalette[colorIndex];

        // Create SVG with sequential color
        const svg = createSVGComponent(selectedColor, uniqueId);

        // Create circular story button (like in provided HTML) - bigger size
        const storyButton = document.createElement('div');
        storyButton.className = 'story-button';
        storyButton.style.height = 'auto';
        storyButton.style.minWidth = '80px';
        storyButton.style.width = '80px';
        storyButton.style.overflow = 'visible';
        storyButton.style.position = 'relative';
        storyButton.style.cursor = 'pointer';
        storyButton.style.transition = 'transform 0.3s ease';

        // Store letter data
        storyButton.dataset.letterData = JSON.stringify({
          video_url: letter.video_url || '',
          audio_url: letter.audio_url || '',
          message: letter.message || '',
          name: letter.name || 'Anonymous',
          photo_url: letter.photo_url || ''
        });

        // Make SVG fit in circular container - bigger
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.display = 'block';
        svg.style.objectFit = 'cover';

        // Create wrapper for SVG to contain it
        const svgWrapper = document.createElement('div');
        svgWrapper.style.width = '100%';
        svgWrapper.style.height = '100%';
        svgWrapper.style.overflow = 'hidden';
        svgWrapper.style.position = 'relative';
        svgWrapper.appendChild(svg);

        // Add name text at bottom right (overlay on SVG)
        const nameText = document.createElement('div');
        nameText.textContent = letter.name || 'Anonymous';
        nameText.style.fontFamily = "'Playpen Sans', cursive";
        nameText.style.position = 'absolute';
        nameText.style.bottom = '8%';
        nameText.style.right = '8%';
        nameText.style.fontSize = '11px';
        nameText.style.fontWeight = '600';
        nameText.style.color = '#000000';
        nameText.style.pointerEvents = 'none';
        nameText.style.zIndex = '10';
        nameText.style.whiteSpace = 'nowrap';
        nameText.style.textShadow = '0 1px 2px rgba(255, 255, 255, 0.8)';
        nameText.style.maxWidth = '70%';
        nameText.style.overflow = 'hidden';
        nameText.style.textOverflow = 'ellipsis';

        // Append SVG wrapper and name
        storyButton.appendChild(svgWrapper);
        storyButton.appendChild(nameText);

        // Add click handler
        storyButton.addEventListener('click', (e) => {
          e.stopPropagation();
          // Remove active class from all buttons
          document.querySelectorAll('.story-button').forEach((btn) => btn.classList.remove('active'));
          // Add active class to clicked button
          storyButton.classList.add('active');

          const letterData = JSON.parse(storyButton.dataset.letterData);

          // Dispatch custom event to open letter detail
          const event = new CustomEvent('openLetterDetail', {
            detail: {
              letterData: {
                video_url: letterData.video_url,
                audio_url: letterData.audio_url,
                message: letterData.message,
                name: letterData.name,
                photo_url: letterData.photo_url
              }
            }
          });
          document.dispatchEvent(event);
        });

        lettersListBottom.appendChild(storyButton);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Ensure letters list is hidden on page load
      const lettersListBottom = document.getElementById('letters-list-bottom');
      if (lettersListBottom) {
        lettersListBottom.style.display = 'none';
      }

      // Load the video but keep it paused
      videoElement.load();
      videoElement.play();

      // Try to preload the video
      videoElement.addEventListener("loadedmetadata", function () {
        console.log("Video metadata loaded");
        updateVideoHeight();
        updateVideoWidth();
      });

      // Update dimensions when video source changes
      videoElement.addEventListener("loadeddata", function () {
        updateVideoHeight();
        updateVideoWidth();
      });

      const orderID = getUrlParameter("orderID");
      console.log("Fetching content for orderID:", orderID);

      if (!orderID) {
        console.log("No orderID found, redirecting to base URL...");
        window.location.href =
          "https://slamatslimit.byc.plus/experience-app/ar";
        return;
      }

      // Fetch content from API
      fetch(`https://slamatslimit.byc.plus/api/gallery?order_id=${orderID}`)
        .then((response) => {
          console.log("API Response status:", response.status);
          return response.json();
        })
        .then((data) => {
          console.log("API Response data:", data);
          if (!data || data.length === 0) {
            console.log(
              "No data received, redirecting to order-specific URL..."
            );
            window.location.href = `https://slamatslimit.byc.plus/experience-app/ar/${orderID}`;
            return;
          }

          // Update AR images with data from API/Supabase
          initializeImageGrids(data);

          // Render letters in bottom list
          renderLettersBottomLeft(data).catch((error) => {
            console.error("Error rendering letters:", error);
          });

          // Preload content assets on page load (while waiting for marker)
          preloadContentAssets(data);

          // Store content data globally for sequential display (will start when marker detected)
          window.sequentialContentData = data;
        })
        .catch((error) => {
          console.error("Error fetching content:", error);
          // console.log("Redirecting due to error...");
          // window.location.href =
          //   "https://slamatslimit.byc.plus/experience-app/ar";
        });

      const messageModal = document.getElementById("messageModal");
      const modalMessage = document.getElementById("modalMessage");

      // Add the mute button to the right of the record button
      const muteButton = document.createElement("div");
      muteButton.id = "muteButton";
      muteButton.style.position = "fixed";
      muteButton.style.bottom = "4.5svh";
      muteButton.style.left = "calc(50% + 13svh)";
      muteButton.style.transform = "translateX(-50%)";
      muteButton.style.width = "5svh";
      muteButton.style.height = "5svh";
      muteButton.style.backgroundColor = "#FFC61C";
      muteButton.style.borderRadius = "50%";
      muteButton.style.display = "flex";
      muteButton.style.justifyContent = "center";
      muteButton.style.alignItems = "center";
      muteButton.style.cursor = "pointer";
      muteButton.style.zIndex = "20";
      muteButton.style.border = "none";
      muteButton.style.padding = "0";
      muteButton.innerHTML = `
          <svg id="sound-on" style="width: 60%; height: 60%; display: block;" xmlns="http://www.w3.org/2000/svg" height="24"
            viewBox="0 0 24 24" width="24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
              fill="#000000" />
          </svg>
          <svg id="sound-off" style="width: 60%; height: 60%; display: none;" xmlns="http://www.w3.org/2000/svg" height="24"
            viewBox="0 0 24 24" width="24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
              d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"
              fill="#000000" />
          </svg>
        `;
      document.body.appendChild(muteButton);

      // Add functionality to toggle mute state
      const soundOn = muteButton.querySelector("#sound-on");
      const soundOff = muteButton.querySelector("#sound-off");
      // Remove local isMuted, use slideshowState.isMuted

      muteButton.addEventListener("click", () => {
        slideshowState.isMuted = !slideshowState.isMuted;
        const isMuted = slideshowState.isMuted;

        // Toggle video mute
        if (videoElement) {
          videoElement.muted = isMuted;
        }

        // Toggle slideshow audio mute
        const contentAudio = document.getElementById('content-audio');
        if (contentAudio) {
          contentAudio.muted = isMuted;
        }

        // Toggle background music
        const bgMusic = document.getElementById('background-music');
        if (bgMusic) {
          if (isMuted) {
            bgMusic.muted = true;
            bgMusic.pause();
          } else {
            bgMusic.muted = false;
            if (bgMusic.paused) {
              bgMusic.play().catch(e => console.log('Background music play error:', e));
            }
          }
        }

        // Toggle icon visibility
        if (soundOn && soundOff) {
          if (isMuted) {
            soundOn.style.display = "none";
            soundOff.style.display = "block";
          } else {
            soundOn.style.display = "block";
            soundOff.style.display = "none";
          }
        }
      });



      // Add event listener to close the modal when clicking on the overlay
      messageModal.addEventListener("click", (event) => {
        if (event.target === messageModal) {
          messageModal.style.display = "none";
        }
      });

      const closeModalButton = document.getElementById("closeModalButton");
      closeModalButton.addEventListener("click", () => {
        messageModal.style.display = "none";
      });

      // Close handlers for letter detail modal
      const closeLetterDetail = () => {
        if (lettersDetail) {
          // Stop video and audio when closing
          if (ruryVideo) {
            ruryVideo.pause();
            ruryVideo.currentTime = 0;
          }
          if (ruryAudio) {
            ruryAudio.pause();
            ruryAudio.currentTime = 0;
          }

          // Show the AR video again
          const arsaVideo = document.getElementById('arsa-video');
          if (arsaVideo) {
            arsaVideo.style.display = '';
          }

          lettersDetail.style.display = 'none';

          // Resulme slideshow from next item
          resumeSlideshowNext();
        }
      };

      if (lettersDetailOverlay) {
        lettersDetailOverlay.addEventListener('click', closeLetterDetail);
      }

      // Note: If you have a specific close button inside letters-detail, add event listener here
      // For example:
      // const closeLetterBtn = document.getElementById('close-letter-btn');
      // if (closeLetterBtn) closeLetterBtn.addEventListener('click', closeLetterDetail);

      const recordButton = document.getElementById("recordButton");
      const recordInner = document.getElementById("recordInner");
      let isRecording = false;

      recordButton.addEventListener("click", () => {
        isRecording = !isRecording;
        if (isRecording) {
          recordInner.style.borderRadius = "0";
          recordInner.style.width = "20px";
          recordInner.style.height = "20px";
        } else {
          recordInner.style.borderRadius = "50%";
          recordInner.style.width = "30px";
          recordInner.style.height = "30px";
        }
      });

      const galleryButton = document.getElementById("galleryButton");
      galleryButton.addEventListener("click", () => {
        window.location.href = `/gallery.html?orderID=${orderID.toUpperCase()}`;
      });

      // Track detected markers and background music state
      const detectedMarkers = new Set();
      const backgroundMusic = document.getElementById('background-music');
      let backgroundMusicStarted = false;

      // Setup background music
      if (backgroundMusic) {
        backgroundMusic.volume = 0.3; // Lower volume compared to modal audio (which is 1.0)
        backgroundMusic.loop = true;
      }

      // Add event listeners for both markers
      document.querySelectorAll("a-marker").forEach((marker) => {
        marker.addEventListener("markerFound", function () {
          console.log("Marker is found");
          const markerId = marker.id || marker.getAttribute('url');
          detectedMarkers.add(markerId);

          // Ensure video is loaded and play it
          videoElement.load();
          const playPromise = videoElement.play();
          if (playPromise !== undefined) {
            playPromise.catch((error) => {
              console.log("Error playing video:", error);
              // If autoplay with unmute fails, try playing muted
              if (error.name === "NotAllowedError") {
                videoElement.muted = true;
                videoElement
                  .play()
                  .catch((e) =>
                    console.log("Even muted autoplay failed:", e)
                  );
              }
            });
          }
          if (pauseTimeout) {
            clearTimeout(pauseTimeout);
          }

          videoElement.muted = false; // Unmute when marker is detected
          videoElement.volume = 1; // Set volume to maximum

          // Show letters list when marker is found
          const lettersListBottom = document.getElementById('letters-list-bottom');
          if (lettersListBottom) {
            lettersListBottom.style.display = 'flex';
          }

          // Start sequential image display when marker is detected (only if not already running)
          if (window.sequentialContentData && !slideshowState.isRunning) {
            startSequentialImageDisplay(window.sequentialContentData);
          }

          // Play background music when marker is found for the first time
          if (backgroundMusic && !backgroundMusicStarted) {
            backgroundMusic.play().catch(e => {
              console.log('Background music play error:', e);
              // Retry after a short delay
              setTimeout(() => {
                backgroundMusic.play().catch(err => console.log('Background music retry error:', err));
              }, 500);
            });
            backgroundMusicStarted = true;
          } else if (backgroundMusic && backgroundMusicStarted) {
            // Resume background music if it was paused (don't reset position)
            if (backgroundMusic.paused) {
              backgroundMusic.play().catch(e => console.log('Background music resume error:', e));
            }
          }

          // Hide the overlay when the marker is found
          const markerNotFoundOverlay = document.getElementById(
            "markerNotFoundOverlay"
          );
          if (!markerDetectedOnce) {
            markerNotFoundOverlay.style.transition = "opacity 0.5s ease";
            markerNotFoundOverlay.style.opacity = "0";
            setTimeout(() => {
              markerNotFoundOverlay.style.display = "none";
            }, 500); // Wait for the transition to complete
            markerDetectedOnce = true;
          }
        });

        marker.addEventListener("markerLost", function () {
          console.log("Marker is lost");
          const markerId = marker.id || marker.getAttribute('url');
          detectedMarkers.delete(markerId);

          pauseTimeout = setTimeout(() => {
            // Only pause if marker is still lost (check if it's back in detectedMarkers)
            if (!detectedMarkers.has(markerId)) {
              videoElement.pause();
              console.log("Video and audio paused due to marker loss");

              // Pause background music when marker is lost
              if (backgroundMusic && !backgroundMusic.paused) {
                backgroundMusic.pause();
              }

              // Hide letters list when all markers are lost
              if (detectedMarkers.size === 0) {
                const lettersListBottom = document.getElementById('letters-list-bottom');
                if (lettersListBottom) {
                  lettersListBottom.style.display = 'none';
                }

                // Hide sequential images and stop audio when all markers are lost
                const leftImage = document.getElementById('top-left-image');
                const rightImage = document.getElementById('top-right-image');
                const contentAudio = document.getElementById('content-audio');

                if (leftImage) {
                  leftImage.style.left = '-50svh';
                }
                if (rightImage) {
                  rightImage.style.right = '-50svh';
                }
                if (contentAudio) {
                  contentAudio.pause();
                  contentAudio.currentTime = 0;
                }

                // Stop sequential display
                pauseSlideshow();
              }

              // Only show the overlay when ALL markers are lost
              if (detectedMarkers.size === 0) {
                const markerNotFoundOverlay = document.getElementById(
                  "markerNotFoundOverlay"
                );
                markerNotFoundOverlay.style.display = "block";
              }
            }
          }, 2000); // 2 second delay before hiding content

        });
      });
    });

    window.addEventListener("beforeunload", () => {
      const videoElement = document.getElementById("arsa-video");
      if (videoElement) {
        videoElement.pause();
      }
    });

    // Letter detail modal functionality
    const lettersDetail = document.getElementById('letters-detail');
    const lettersDetailOverlay = document.getElementById('letters-detail-overlay');
    const videoComponent = document.getElementById('video-component');
    const letterComponent = document.getElementById('letter-component');
    const ruryVideo = document.getElementById('rury-video');
    const ruryAudio = document.getElementById('rury-audio');
    const audioIcon = document.getElementById('audio-icon');

    // Listen for letter detail open event
    document.addEventListener('openLetterDetail', (e) => {
      if (lettersDetail && e.detail && e.detail.letterData) {
        const letterData = e.detail.letterData;


        // Pause sequential display
        pauseSlideshow();

        // Hide the AR video behind letters
        const arsaVideo = document.getElementById('arsa-video');
        if (arsaVideo) {
          arsaVideo.style.display = 'none';
        }

        // Hide both video and audio initially
        if (ruryVideo) {
          ruryVideo.style.display = 'none';
          ruryVideo.src = '';
          ruryVideo.pause();
        }
        if (ruryAudio) {
          ruryAudio.style.display = 'none';
          ruryAudio.src = '';
          ruryAudio.pause();
        }
        if (audioIcon) {
          audioIcon.style.display = 'none';
        }

        // Update media component - prioritize video, then audio
        // Support both video_url/audio_url (from API) and video/audio (from mailbox)
        const hasVideo = (letterData.video_url && letterData.video_url.trim() !== '') ||
          (letterData.video && letterData.video.trim() !== '');
        const hasAudio = (letterData.audio_url && letterData.audio_url.trim() !== '') ||
          (letterData.audio && letterData.audio.trim() !== '');

        const videoUrl = letterData.video_url || letterData.video || '';
        const audioUrl = letterData.audio_url || letterData.audio || '';

        if (hasVideo && ruryVideo && videoUrl) {
          if (audioIcon) audioIcon.style.display = 'none';
          ruryVideo.src = videoUrl;
          ruryVideo.style.display = 'block';
          const playVideo = () => {
            ruryVideo.play().catch(e => {
              console.log('Video autoplay error:', e);
              setTimeout(() => {
                ruryVideo.play().catch(err => console.log('Video retry error:', err));
              }, 500);
            });
          };
          if (ruryVideo.readyState >= 2) {
            playVideo();
          } else {
            ruryVideo.addEventListener('canplay', playVideo, { once: true });
            ruryVideo.load();
          }
        } else if (hasAudio && ruryAudio && audioUrl) {
          if (ruryVideo) ruryVideo.style.display = 'none';
          if (audioIcon) audioIcon.style.display = 'flex';
          ruryAudio.muted = false;
          ruryAudio.volume = 1.0;
          ruryAudio.src = audioUrl;
          ruryAudio.style.display = 'block';
          const playAudio = () => {
            ruryAudio.muted = false;
            ruryAudio.volume = 1.0;
            ruryAudio.play().then(() => {
              console.log('Audio playing successfully');
            }).catch(e => {
              console.log('Audio autoplay error:', e);
              setTimeout(() => {
                ruryAudio.muted = false;
                ruryAudio.volume = 1.0;
                ruryAudio.play().catch(err => console.log('Audio retry error:', err));
              }, 500);
            });
          };
          if (ruryAudio.readyState >= 2) {
            playAudio();
          } else {
            ruryAudio.addEventListener('canplay', playAudio, { once: true });
            ruryAudio.addEventListener('loadeddata', playAudio, { once: true });
            ruryAudio.addEventListener('canplaythrough', playAudio, { once: true });
            ruryAudio.load();
          }
        }

        // Update photo component
        const photoImg = document.getElementById('photo-component-img');
        if (photoImg) {
          const photoUrl = letterData.photo_url || letterData.photo || '';
          if (photoUrl && photoUrl.trim() !== '') {
            photoImg.src = photoUrl;
            photoImg.style.display = 'block';
          } else {
            photoImg.style.display = 'none';
          }
        }

        // Update sender name
        const letterSender = document.getElementById('letter-component-sender');
        if (letterSender) {
          const senderName = letterData.name || letterData.senderName || '';
          if (senderName && senderName.trim() !== '') {
            letterSender.textContent = senderName;
            letterSender.style.display = 'block';
          } else {
            letterSender.style.display = 'none';
          }
        }

        // Update letter text component
        const letterText = document.getElementById('letter-component-text');
        if (letterText) {
          const message = letterData.message || letterData.text || '';
          if (message) {
            letterText.textContent = message;
          }
        }

        // Center letter if no video and no audio
        if (!hasVideo && !hasAudio && letterComponent) {
          letterComponent.style.left = '50%';
          letterComponent.style.right = 'auto';
          letterComponent.style.transform = 'translateX(-50%) rotate(1deg)';
          if (videoComponent) videoComponent.style.display = 'none';
          const pinSvg = document.getElementById('pin-svg');
          if (pinSvg) pinSvg.style.display = 'none';
        } else if (letterComponent) {
          letterComponent.style.left = '0';
          letterComponent.style.right = '0';
          letterComponent.style.transform = 'rotate(1deg)';
          if (videoComponent) videoComponent.style.display = 'flex';
          const pinSvg = document.getElementById('pin-svg');
          if (pinSvg) pinSvg.style.display = 'block';
        }

        lettersDetail.style.display = 'block';
      }
    });

    // Close modal when overlay is clicked

  </script>
