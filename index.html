<!DOCTYPE html>
<html>
  <head>
    <title>AR.js with A-Frame</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.7.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden">
    <a-scene
      embedded
      arjs="debugUIEnabled: false; sourceType: webcam;"
      vr-mode-ui="enabled: false"
    >
      <!-- Define a marker using the Hiro pattern -->
      <a-marker type="pattern" url="pattern-highfive-green.patt">
        <!-- Add a white plane as a container for the video -->
        <a-plane
          color="white"
          width="1.1"
          height="2"
          position="0 0 0.1"
          rotation="-90 0 0"
        ></a-plane>
        <!-- Play a video on a plane with cropping effect -->
        <a-video
          src="#arsa-video"
          width=".9"
          height="1.6"
          position="0 0.05 0"
          rotation="-90 0 0"
        ></a-video>
        <!-- Overlay images in front of the video -->
        <a-image
          src="./assets/images/bedug.png"
          width="0.7"
          height="0.7"
          position="-8 0.5 -0.8"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/mosque.png"
          width="0.7"
          height="0.7"
          position=".7 0.4 0.7"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/ketupat.png"
          width="0.4"
          height="0.4"
          position="-0.6 0.2 0.9"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/love.png"
          width="0.7"
          height="0.7"
          position=".7 0.6 -.7"
          rotation="-90 0 0"
        ></a-image>

        <a-image
          src="./assets/images/star.png"
          width="0.6"
          height="0.6"
          position="-.8 0.5 0.2"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/sparkle.png"
          width="0.4"
          height="0.4"
          position=".6 0.2 0"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/moon.png"
          width="0.5"
          height="0.5"
          position="-.5 0.3 -0.5"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/moonmuffin.png"
          width=".6"
          height="0.2"
          position="0 0.2 .9"
          rotation="-90 0 0"
        ></a-image>
      </a-marker>
      <!-- Add a camera -->
      <a-entity camera></a-entity>
    </a-scene>
    <video
      id="arsa-video"
      src="./assets/videos/arsa.mp4"
      loop="true"
      style="display: none"
    ></video>
    <script>
      let videoElement = document.getElementById("arsa-video");
      let pauseTimeout;

      document
        .querySelector("a-marker")
        .addEventListener("markerFound", function () {
          console.log("Marker is found");
          videoElement.play();
          if (pauseTimeout) {
            clearTimeout(pauseTimeout);
          }
        });

      document
        .querySelector("a-marker")
        .addEventListener("markerLost", function () {
          console.log("Marker is lost");
          pauseTimeout = setTimeout(() => {
            videoElement.pause();
            console.log("Video paused due to marker loss");
          }, 500); // Pause after 3 seconds
        });
    </script>
  </body>
</html>
