<!DOCTYPE html>
<html>
  <head>
    <title>AR App | Moon Muffin</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/1.7.7/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden; z-index: 0">
    <a-scene
      style="z-index: 1"
      embedded
      arjs="debugUIEnabled: false; sourceType: webcam;"
      vr-mode-ui="enabled: false"
    >
      <!-- Define a marker using the Hiro pattern -->
      <a-marker type="pattern" url="pattern-sparkle-black.patt">
        <!-- Add a white plane as a container for the video -->
        <a-plane
          color="white"
          width="1.1"
          height="2"
          position="0 0 0.1"
          rotation="-90 0 0"
        ></a-plane>
        <!-- Play a video on a plane with cropping effect -->
        <a-video
          src="#arsa-video"
          width=".9"
          height="1.6"
          position="0 0.05 0"
          rotation="-90 0 0"
        ></a-video>
        <!-- Overlay images in front of the video -->
        <a-image
          src="./assets/images/bedug.png"
          width="0.7"
          height="0.7"
          position="-8 0.5 -0.8"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/mosque.png"
          width="0.7"
          height="0.7"
          position=".75 0.4 0.7"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/ketupat.png"
          width="0.4"
          height="0.4"
          position="-0.6 0.2 0.8"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/love.png"
          width="0.55"
          height="0.55"
          position=".6 0.6 -.6"
          rotation="-90 0 0"
        ></a-image>

        <a-image
          src="./assets/images/star.png"
          width="0.6"
          height="0.6"
          position="-.8 0.4 0.1"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/sparkle.png"
          width="0.4"
          height="0.4"
          position=".6 0.2 0"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/moon.png"
          width="0.5"
          height="0.5"
          position="-.5 0.3 -0.6"
          rotation="-90 0 0"
        ></a-image>
        <a-image
          src="./assets/images/moonmuffin.png"
          width=".6"
          height="0.2"
          position="0 0.2 .9"
          rotation="-90 0 0"
        ></a-image>
      </a-marker>
      <!-- Add a camera -->
      <a-entity camera></a-entity>
    </a-scene>
    <div
      id="stories"
      style="
        display: flex;
        position: fixed;
        top: 4vh;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        width: auto;
        gap: 10px;
      "
    >
      <div
        class="story-button"
        style="
          height: 60px;
          width: 60px;
          background-color: #000;
          border-radius: 50%;
          overflow: hidden;
        "
      >
        <video
          src="./assets/videos/arsa.mp4"
          loop
          muted
          autoplay
          playsinline
          style="width: 100%; height: 100%; object-fit: cover"
        ></video>
      </div>
      <div
        class="story-button"
        style="
          height: 60px;
          width: 60px;
          background-color: #000;
          border-radius: 50%;
          overflow: hidden;
        "
      >
        <video
          src="./assets/videos/kojo.mp4"
          loop
          muted
          autoplay
          playsinline
          style="width: 100%; height: 100%; object-fit: cover"
        ></video>
      </div>
    </div>
    <video
      id="arsa-video"
      src="./assets/videos/arsa.mp4"
      loop="true"
      style="display: none"
    ></video>
    <script>
      let videoElement = document.getElementById("arsa-video");
      let pauseTimeout;

      document.addEventListener("DOMContentLoaded", function () {
        const storiesElement = document.getElementById("stories");
        const messageElement = document.createElement("div");
        messageElement.style.position = "fixed";
        messageElement.style.bottom = "10px";
        messageElement.style.left = "50%";
        messageElement.style.transform = "translateX(-50%)";
        messageElement.style.color = "white";
        messageElement.style.backgroundColor = "rgba(0, 0, 0, 0.5)";
        messageElement.style.padding = "10px";
        messageElement.style.borderRadius = "5px";
        document.body.appendChild(messageElement);

        const friends = [
          {
            name: "Arsa",
            message:
              "Hi all! \n\nI hope this message finds you well. I wanted to take a moment to sincerely apologize for any misunderstandings or inconveniences I may have caused. Your friendship means the world to me, and I truly appreciate your kindness and support. Thank you for being such a wonderful friend.\n\nWarm regards,\n[Your Name]",
            video: "./assets/videos/arsa.mp4",
          },
          {
            name: "Kojo",
            message:
              "Hi all!\n\nI hope you're doing great. I am writing to express my heartfelt apologies for any mistakes I might have made. Your friendship is incredibly valuable to me, and I am grateful for your patience and understanding. Thank you for being an amazing friend.\n\nBest wishes,\n[Your Name]",
            video: "./assets/videos/kojo.mp4",
          },
        ];

        // Function to update video and message
        function updateContent(index) {
          videoElement.src = friends[index].video;
          messageElement.textContent = friends[index].message;
          videoElement.play();
        }

        // Initially hide the stories
        storiesElement.style.display = "none";

        // Set default video and message
        updateContent(0);

        document
          .querySelector("a-marker")
          .addEventListener("markerFound", function () {
            console.log("Marker is found");
            videoElement.play();
            if (pauseTimeout) {
              clearTimeout(pauseTimeout);
            }
            // Show the stories when the marker is found
            storiesElement.style.display = "flex";
          });

        document
          .querySelector("a-marker")
          .addEventListener("markerLost", function () {
            console.log("Marker is lost");
            pauseTimeout = setTimeout(() => {
              videoElement.pause();
              console.log("Video paused due to marker loss");
            }, 500); // Pause after 3 seconds
            // Hide the stories when the marker is lost
            storiesElement.style.display = "none";
          });

        // Add click event listeners to story buttons
        const storyButtons = document.querySelectorAll(".story-button");
        storyButtons.forEach((button, index) => {
          button.addEventListener("click", () => {
            updateContent(index);
          });
        });
      });
    </script>
  </body>
</html>
