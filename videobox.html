<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Jakarta Floss — AR Video Experience</title>
  <link rel="icon" type="image/x-icon" href="/icon.ico" />

  <!-- Google Fonts: Instrument Serif & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: "#F9F6F0",
            "cream-dark": "#F0EAE1",
            wine: "#801A20",
            "wine-dark": "#631318",
            "wine-light": "#96232A",
            forest: "#323B33",
            charcoal: "#1F201E",
            gold: "#C49A45",
            "gold-light": "#E5C882",
          },
          fontFamily: {
            serif: ['"Instrument Serif"', "serif"],
            sans: ['"Plus Jakarta Sans"', "sans-serif"],
          },
        },
      },
    };
  </script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- A-Frame 1.6.0 & MindAR 1.2.5 Image Tracking -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --color-cream: #F9F6F0;
      --color-wine: #801A20;
      --color-charcoal: #1F201E;
      --color-gold: #C49A45;
    }
    body {
      margin: 0;
      overflow: hidden;
      font-family: "Plus Jakarta Sans", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000;
    }
    .font-instrument {
      font-family: "Instrument Serif", serif;
    }
    .editorial-badge {
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .hud-card {
      background: rgba(249, 246, 240, 0.94);
      backdrop-filter: blur(8px);
      border: 2px solid var(--color-charcoal);
      box-shadow: 3px 3px 0px var(--color-charcoal);
    }
    .bento-btn {
      border: 2px solid var(--color-charcoal);
      box-shadow: 2px 2px 0px var(--color-charcoal);
      transition: all 0.15s ease;
    }
    .bento-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--color-charcoal);
    }
    @keyframes pulseRing {
      0% { transform: scale(0.96); opacity: 0.8; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.8; }
    }
    .target-box {
      animation: pulseRing 3s ease-in-out infinite;
    }
    /* Disable touch interception on A-Frame canvas */
    .a-canvas {
      pointer-events: none !important;
    }
    .a-enter-vr-button, .a-orientation-modal {
      display: none !important;
    }
  </style>
</head>

<body class="bg-black text-charcoal">

  <!-- A-Frame Container Mount with Static MindAR Scene (Starts camera immediately on HTML load!) -->
  <div id="arSceneContainer" class="fixed inset-0 w-full h-full z-[1]">
    <a-scene
      id="mainArScene"
      embedded
      mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: true; maxTrack: 6; uiLoading: no; uiError: no; uiScanning: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      style="width: 100%; height: 100%; position: absolute; inset: 0;"
    >
      <a-assets timeout="10000">
        <video id="video-asset-0" src="https://fowdecmskhvfgmdwwnxg.supabase.co/storage/v1/object/public/tjf_photos/photos/TJF_TJF-VIDEOBOX_video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop preload="auto" muted></video>
        <video id="video-asset-1" src="https://fowdecmskhvfgmdwwnxg.supabase.co/storage/v1/object/public/tjf_photos/photos/TJF_TJF-VIDEOBOX_video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop preload="auto" muted></video>
        <video id="video-asset-2" src="https://fowdecmskhvfgmdwwnxg.supabase.co/storage/v1/object/public/tjf_photos/photos/TJF_TJF-VIDEOBOX_video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop preload="auto" muted></video>
        <video id="video-asset-3" src="https://fowdecmskhvfgmdwwnxg.supabase.co/storage/v1/object/public/tjf_photos/photos/TJF_TJF-VIDEOBOX_video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop preload="auto" muted></video>
        <video id="video-asset-4" src="https://fowdecmskhvfgmdwwnxg.supabase.co/storage/v1/object/public/tjf_photos/photos/TJF_TJF-VIDEOBOX_video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop preload="auto" muted></video>
        <video id="video-asset-5" src="https://fowdecmskhvfgmdwwnxg.supabase.co/storage/v1/object/public/tjf_photos/photos/TJF_TJF-VIDEOBOX_video.mp4" crossorigin="anonymous" playsinline webkit-playsinline loop preload="auto" muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-anchor-0">
        <a-plane width="1.0" height="1.33" position="0 0 0" material="color: #000; shader: flat; side: double;"></a-plane>
        <a-video id="video-plane-0" src="#video-asset-0" width="1.0" height="1.33" position="0 0 0.005" material="shader: flat; side: double; transparent: false;"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" id="target-anchor-1">
        <a-plane width="1.0" height="1.33" position="0 0 0" material="color: #000; shader: flat; side: double;"></a-plane>
        <a-video id="video-plane-1" src="#video-asset-1" width="1.0" height="1.33" position="0 0 0.005" material="shader: flat; side: double; transparent: false;"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2" id="target-anchor-2">
        <a-plane width="1.0" height="1.33" position="0 0 0" material="color: #000; shader: flat; side: double;"></a-plane>
        <a-video id="video-plane-2" src="#video-asset-2" width="1.0" height="1.33" position="0 0 0.005" material="shader: flat; side: double; transparent: false;"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3" id="target-anchor-3">
        <a-plane width="1.0" height="1.33" position="0 0 0" material="color: #000; shader: flat; side: double;"></a-plane>
        <a-video id="video-plane-3" src="#video-asset-3" width="1.0" height="1.33" position="0 0 0.005" material="shader: flat; side: double; transparent: false;"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4" id="target-anchor-4">
        <a-plane width="1.0" height="1.33" position="0 0 0" material="color: #000; shader: flat; side: double;"></a-plane>
        <a-video id="video-plane-4" src="#video-asset-4" width="1.0" height="1.33" position="0 0 0.005" material="shader: flat; side: double; transparent: false;"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 5" id="target-anchor-5">
        <a-plane width="1.0" height="1.33" position="0 0 0" material="color: #000; shader: flat; side: double;"></a-plane>
        <a-video id="video-plane-5" src="#video-asset-5" width="1.0" height="1.33" position="0 0 0.005" material="shader: flat; side: double; transparent: false;"></a-video>
      </a-entity>
    </a-scene>
  </div>

  <!-- Viewfinder Overlay for Marker Aiming -->
  <div id="scanOverlay" class="fixed inset-0 pointer-events-none z-10 flex flex-col items-center justify-between p-6">
    <!-- Top Header -->
    <div class="w-full max-w-sm flex items-center justify-between pointer-events-auto">
      <div class="hud-card px-3 py-1.5 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-bold text-[10px] tracking-wider text-charcoal uppercase" id="cameraStatus">
          AR SCANNER ACTIVE
        </span>
      </div>

      <div class="flex gap-2">
        <!-- Audio Toggle (Unmuted by default) -->
        <button
          id="btnToggleAudio"
          onclick="toggleAudio()"
          class="bento-btn bg-white hover:bg-cream text-charcoal px-3 py-1.5 text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 cursor-pointer"
          title="Toggle Sound"
        >
          <span id="audioIcon">🔊</span>
          <span id="audioText" class="text-[10px]">Sound On</span>
        </button>

        <!-- Lihat Hasil Photobox Button -->
        <a
          id="btnBackSoftfile"
          href="softfile.html"
          class="bento-btn bg-wine text-white hover:bg-wine-dark px-3 py-1.5 text-[10px] font-bold tracking-wider uppercase flex items-center gap-1 shadow-sm cursor-pointer"
        >
          📷 LIHAT HASIL PHOTOBOX
        </a>
      </div>
    </div>

    <!-- Center Viewfinder Target Box -->
    <div id="centerViewfinder" class="relative w-72 h-80 max-w-[85vw] max-h-[55vh] border-2 border-white/70 rounded-xl target-box flex flex-col items-center justify-between p-4 shadow-[0_0_30px_rgba(0,0,0,0.6)]">
      <!-- 4 Corner Accents -->
      <div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-gold rounded-tl"></div>
      <div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-gold rounded-tr"></div>
      <div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-gold rounded-bl"></div>
      <div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-gold rounded-br"></div>

      <!-- Instruction Text -->
      <div class="editorial-badge text-[11px] text-white bg-wine/90 border border-gold/50 px-3 py-1.5 rounded tracking-wider text-center font-bold shadow-lg">
        arahkan ke Cover Packaging Gift Station
      </div>

      <div id="targetFoundBadge" class="hidden bg-emerald-500 text-white font-black text-[11px] px-3 py-1 rounded shadow-lg tracking-widest uppercase animate-bounce">
        ✦ MARKER DETECTED ✦
      </div>

      <span class="text-[9px] text-white/70 text-center font-medium">
        Keep image flat &amp; well-lit
      </span>
    </div>

    <!-- Bottom Status / Session Indicator -->
    <div class="w-full max-w-sm pointer-events-auto flex flex-col items-center gap-2">
      <div id="sessionIndicator" class="text-center text-[10px] text-white/80 font-mono bg-black/60 px-3 py-1 rounded border border-white/20 hidden">
        Session: <span id="lblSessionCode" class="text-gold font-bold"></span>
      </div>
    </div>
  </div>

  <!-- Loading Overlay Screen -->
  <div id="loadingOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300">
    <div class="max-w-xs w-full bg-[#F9F6F0] border-2 border-charcoal p-6 shadow-[4px_4px_0px_#1F201E] flex flex-col items-center gap-4">
      <!-- Spinning Vintage Icon -->
      <div class="w-14 h-14 rounded-full border-4 border-charcoal/20 border-t-wine animate-spin flex items-center justify-center">
        <span class="text-lg animate-pulse">✦</span>
      </div>

      <div>
        <h2 class="font-instrument text-3xl text-wine font-bold leading-tight">Starting AR Video</h2>
        <p id="loadingStatusText" class="text-xs text-charcoal/70 mt-1 font-medium">
          Activating camera...
        </p>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-cream border border-charcoal/30 h-3 rounded-full overflow-hidden p-0.5">
        <div id="loadingProgressBar" class="bg-wine h-full w-2/3 transition-all duration-300 rounded-full"></div>
      </div>

      <div class="text-[10px] text-charcoal/50 font-mono tracking-wider">
        THE JAKARTA FLOSS
      </div>
    </div>
  </div>

  <script>
    // Configuration & Supabase
    const SUPABASE_URL = "https://fowdecmskhvfgmdwwnxg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvd2RlY21za2h2ZmdtZHd3bnhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDE1MTk2MjUsImV4cCI6MjAxNzA5NTYyNX0.icC5QydnHRC-qu4Vf0Ik0_BxpaU39TCaU8bXijdqv9Y";
    const DEFAULT_VIDEO_URL = "https://fowdecmskhvfgmdwwnxg.supabase.co/storage/v1/object/public/tjf_photos/photos/TJF_TJF-VIDEOBOX_video.mp4";

    const TARGET_NAMES = [
      "Buttercake",
      "Bolen Lilit",
      "Abon Gulung",
      "Soft Cake Floss",
      "Abon Gulung Mini",
      "Abon Gulung Sosis Gochujang"
    ];

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase initialization notice:", e);
    }

    // State Variables
    const urlParams = new URLSearchParams(window.location.search);
    const sessionCode = (urlParams.get("code") || "").toUpperCase().trim();
    let isAudioUnmuted = true;
    let activeVideoElements = {};

    // Enable unmuted audio on first interaction (mobile policy)
    function enableAudioOnGesture() {
      Object.values(activeVideoElements).forEach((v) => {
        if (v && isAudioUnmuted) {
          v.muted = false;
        }
      });
    }
    window.addEventListener("click", enableAudioOnGesture, { once: true });
    window.addEventListener("touchstart", enableAudioOnGesture, { once: true });

    // UI Elements
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingStatusText = document.getElementById("loadingStatusText");
    const loadingProgressBar = document.getElementById("loadingProgressBar");

    if (sessionCode) {
      const sessionIndicator = document.getElementById("sessionIndicator");
      const lblSessionCode = document.getElementById("lblSessionCode");
      const btnBackSoftfile = document.getElementById("btnBackSoftfile");
      const softfileUrl = `softfile.html?code=${encodeURIComponent(sessionCode)}`;

      if (sessionIndicator) sessionIndicator.classList.remove("hidden");
      if (lblSessionCode) lblSessionCode.textContent = sessionCode;
      if (btnBackSoftfile) btnBackSoftfile.href = softfileUrl;
    }

    function updateProgress(percent, text) {
      if (loadingProgressBar) loadingProgressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
      if (loadingStatusText && text) loadingStatusText.textContent = text;
    }

    function toggleAudio() {
      isAudioUnmuted = !isAudioUnmuted;
      const audioIcon = document.getElementById("audioIcon");
      const audioText = document.getElementById("audioText");
      if (audioIcon) audioIcon.textContent = isAudioUnmuted ? "🔊" : "🔇";
      if (audioText) audioText.textContent = isAudioUnmuted ? "Sound On" : "Muted";

      Object.values(activeVideoElements).forEach((vid) => {
        if (vid) {
          vid.muted = !isAudioUnmuted;
          if (isAudioUnmuted) vid.play().catch(() => {});
        }
      });
    }

    // Audio chime on marker detect
    function playDetectChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (_) {}
    }

    // Smoothly dismiss loading overlay only when camera feed is ready and live
    function dismissLoading() {
      if (loadingOverlay && !loadingOverlay.classList.contains("hidden")) {
        updateProgress(100, "Ready!");
        loadingOverlay.style.opacity = "0";
        setTimeout(() => loadingOverlay.classList.add("hidden"), 350);
      }
    }

    // Setup Target Anchors & Listeners
    for (let i = 0; i < 6; i++) {
      const vid = document.getElementById(`video-asset-${i}`);
      if (vid) activeVideoElements[i] = vid;

      const anchorEl = document.getElementById(`target-anchor-${i}`);
      if (anchorEl) {
        // TARGET FOUND: Overlay video in 3D directly on physical marker, hide square & center UI!
        anchorEl.addEventListener("targetFound", () => {
          console.log(`[AR] Target detected: ${TARGET_NAMES[i]}`);
          playDetectChime();

          const centerViewfinder = document.getElementById("centerViewfinder");
          if (centerViewfinder) centerViewfinder.classList.add("hidden");

          const vid3D = activeVideoElements[i];
          if (vid3D) {
            vid3D.muted = !isAudioUnmuted;
            vid3D.play().catch((e) => console.warn("Video 3D play notice:", e));
          }
        });

        // TARGET LOST: Marker is gone - pause video and restore center viewfinder (DO NOT open video details)
        anchorEl.addEventListener("targetLost", () => {
          console.log(`[AR] Target lost: ${TARGET_NAMES[i]}`);
          const vid3D = activeVideoElements[i];
          if (vid3D) {
            vid3D.pause();
          }

          // Restore center viewfinder
          const centerViewfinder = document.getElementById("centerViewfinder");
          if (centerViewfinder) centerViewfinder.classList.remove("hidden");
        });
      }
    }

    // Listen for MindAR Engine and Camera Readiness
    const sceneEl = document.getElementById("mainArScene");
    if (sceneEl) {
      sceneEl.addEventListener("arReady", () => {
        console.log("[AR] MindAR engine and camera are ready!");
        updateProgress(95, "Camera active!");
        // Verify camera video element is playing so camera is already visible on screen
        const camVideo = document.querySelector("video:not([id^='video-asset'])");
        if (camVideo && camVideo.readyState < 2) {
          camVideo.addEventListener("playing", () => {
            setTimeout(dismissLoading, 100);
          }, { once: true });
        } else {
          setTimeout(dismissLoading, 100);
        }
      });

      sceneEl.addEventListener("arError", (err) => {
        console.error("[AR] Camera error:", err);
        updateProgress(100, "Camera permission required.");
      });
    }

    // Safety fallback: ensure loading screen clears within 2.5s
    setTimeout(dismissLoading, 2500);

    // Asynchronously fetch session video or CMS markers to update video source if needed
    async function syncSessionAndMarkers() {
      let sessionVideoUrl = null;

      if (sessionCode) {
        let sRow = null;
        if (supabaseClient) {
          try {
            const { data } = await supabaseClient
              .from("tjf_sessions")
              .select("*")
              .eq("code", sessionCode)
              .maybeSingle();
            if (data) sRow = data;
          } catch (sErr) {
            console.warn("Session check notice:", sErr);
          }
        }
        if (!sRow) {
          try {
            const r = await fetch(`/api/session/${sessionCode}`);
            const d = await r.json();
            if (d.success && d.session) sRow = d.session;
          } catch (_) {}
        }

        if (sRow) {
          sessionVideoUrl = sRow.video_message_url || sRow.frame_video_url;
        }
      }

      if (sessionVideoUrl) {
        console.log("Applying session video to AR targets:", sessionVideoUrl);
        for (let i = 0; i < 6; i++) {
          const vid = activeVideoElements[i];
          if (vid && vid.src !== sessionVideoUrl) {
            vid.src = sessionVideoUrl;
            vid.load();
          }
        }
      }
    }

    syncSessionAndMarkers();
  </script>
</body>
</html>
