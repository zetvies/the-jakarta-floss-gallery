<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiket Anda - The Jakarta Floss</title>
    <link rel="icon" type="image/svg+xml" href="tjf-logo.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#F9F6F0",
              "cream-dark": "#F0EAE1",
              wine: "#801A20",
              forest: "#323B33",
              charcoal: "#1F201E",
              gold: "#C49A45",
            },
            fontFamily: {
              serif: ['"Instrument Serif"', "serif"],
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #F9F6F0;
        color: #1F201E;
      }
      .font-instrument { font-family: "Instrument Serif", serif; }
      .vintage-box {
        background: #ffffff;
        border: 2px solid #1F201E;
        box-shadow: 4px 4px 0px rgba(31, 32, 30, 0.08);
      }
      .editorial-badge {
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 700;
      }
      
      .spinner {
        border: 3px solid rgba(128, 26, 32, 0.2);
        border-top-color: #801A20;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>

  <body class="bg-cream text-charcoal min-h-screen flex flex-col items-center py-6 px-4">
    
    <div class="w-full max-w-[360px]">
      <!-- Header -->
      <div class="flex flex-col items-center justify-center mb-4 text-center">
        <img src="tjf-logo.svg" alt="The Jakarta Floss" class="w-[50svw] max-w-[140px] h-auto object-contain drop-shadow-md mb-2" />
        <p class="font-sans text-[10px] font-semibold tracking-[0.2em] uppercase text-forest/70">Sistem Tiket Photobox</p>
      </div>

      <!-- Main Ticket Card -->
      <div class="vintage-box p-6 bg-white border-2 border-charcoal text-center shadow-[4px_4px_0px_#801A20]">
        
        <div id="loadingState" class="flex flex-col items-center py-8">
          <div class="spinner mb-4"></div>
          <p class="text-sm font-bold tracking-widest text-charcoal/60 uppercase">Memuat Tiket...</p>
        </div>

        <div id="errorState" class="hidden flex flex-col items-center py-8">
          <svg class="w-10 h-10 text-wine mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <p id="errorMsg" class="font-bold text-wine tracking-wide text-sm mb-4">Tiket Tidak Ditemukan</p>
          <a id="softfileFallbackBtn" href="#" class="hidden px-4 py-2 border-2 border-charcoal bg-forest text-white font-bold text-xs uppercase tracking-wider shadow-[2px_2px_0px_#1F201E] hover:opacity-90 transition-opacity">
            Buka Halaman Softfile
          </a>
        </div>

        <div id="ticketState" class="hidden">
          <div class="border-b-2 border-charcoal/10 pb-3 mb-3 border-dashed">
            <span class="editorial-badge text-[10px] text-charcoal/60 block mb-1">NOMOR ANTREAN</span>
            <div id="displayQueueNumber" class="font-instrument text-5xl text-wine font-bold tracking-wider mb-2">-</div>
          </div>
          
          <div class="mb-4">
            <span class="editorial-badge text-[10px] text-charcoal/60 block mb-1">BOOTH ANDA</span>
            <div id="displayBooth" class="text-2xl font-black text-wine tracking-widest uppercase">BOOTH-X</div>
          </div>

          <div class="bg-cream-dark/40 py-4 px-2 border-2 border-charcoal mb-2 relative">
            <span class="editorial-badge text-[10px] text-charcoal/60 block mb-2">STATUS SAAT INI</span>
            <div id="displayStatus" class="inline-block px-4 py-1 border-2 border-charcoal bg-gold text-white font-bold tracking-[0.2em] uppercase text-sm">
              MENGANTRE
            </div>
            
            <div id="queuePositionBox" class="hidden mt-4 pt-3 border-t border-charcoal/20">
              <p id="queuePositionText" class="text-sm font-bold text-wine tracking-wide"></p>
              <p id="queueAheadDetails" class="text-xs text-charcoal/70 mt-1 italic font-serif"></p>
            </div>
            
            <p id="statusHint" class="text-xs text-charcoal/70 mt-3 px-2 italic font-serif">Harap tunggu giliran Anda. Kami akan segera memanggil Anda.</p>
          </div>
        </div>

      </div>
    </div>

    <!-- ===== JAVASCRIPT LOGIC ===== -->
    <script>
      const SUPABASE_URL = "https://fowdecmskhvfgmdwwnxg.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvd2RlY21za2h2ZmdtZHd3bnhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDE1MTk2MjUsImV4cCI6MjAxNzA5NTYyNX0.icC5QydnHRC-qu4Vf0Ik0_BxpaU39TCaU8bXijdqv9Y";
      
      let supabaseClient = null;
      function getSupabase() {
        if (!supabaseClient && window.supabase) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        return supabaseClient;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const ticketCode = (urlParams.get('code') || '').trim();

      const elLoading = document.getElementById('loadingState');
      const elError = document.getElementById('errorState');
      const elTicket = document.getElementById('ticketState');
      const errorMsg = document.getElementById('errorMsg');
      
      const displayQueueNumber = document.getElementById('displayQueueNumber');
      const displayBooth = document.getElementById('displayBooth');
      const displayStatus = document.getElementById('displayStatus');
      const statusHint = document.getElementById('statusHint');
      
      let isRedirecting = false;
      let isFetching = false;

      const elSoftfileBtn = document.getElementById('softfileFallbackBtn');

      function showError(msg, showFallback = true) {
        elLoading.classList.add('hidden');
        elTicket.classList.add('hidden');
        elError.classList.remove('hidden');
        errorMsg.innerText = msg;
        if (showFallback && ticketCode && elSoftfileBtn) {
          elSoftfileBtn.href = "softfile.html?code=" + encodeURIComponent(ticketCode);
          elSoftfileBtn.classList.remove('hidden');
        } else if (elSoftfileBtn) {
          elSoftfileBtn.classList.add('hidden');
        }
      }

      function compareQueueNumbers(qNumA, qNumB) {
        if (!qNumA || !qNumB) return 0;
        return qNumA.localeCompare(qNumB, undefined, { numeric: true, sensitivity: 'base' });
      }

      function updateUI(queueData, aheadData = []) {
        elLoading.classList.add('hidden');
        elError.classList.add('hidden');
        elTicket.classList.remove('hidden');

        displayQueueNumber.innerText = queueData.queue_number || "-";
        displayBooth.innerText = queueData.booth_id || "SILAKAN HUBUNGI STAFF";
        
        const qPosBox = document.getElementById('queuePositionBox');
        const qPosText = document.getElementById('queuePositionText');
        const qPosDetails = document.getElementById('queueAheadDetails');

        const status = (queueData.status || '').toLowerCase();
        
        if (status === 'queueing' || status === 'waiting') {
          if (queueData.booth_id && aheadData.length === 0) {
            displayStatus.innerText = "GILIRAN ANDA";
            displayStatus.className = "inline-block px-4 py-1 border-2 border-charcoal bg-forest text-white font-bold tracking-[0.2em] uppercase text-sm";
            statusHint.innerText = "Silakan masuk ke booth sekarang.";
            statusHint.className = "text-sm font-bold text-forest mt-3 px-2 uppercase tracking-wider";
            statusHint.classList.remove('hidden');
            qPosBox.classList.add('hidden');
          } else if (queueData.booth_id && aheadData.length > 0) {
            displayStatus.innerText = "MENGANTRE";
            displayStatus.className = "inline-block px-4 py-1 border-2 border-charcoal bg-gold text-white font-bold tracking-[0.2em] uppercase text-sm";
            
            qPosBox.classList.remove('hidden');
            statusHint.classList.add('hidden');
            qPosText.innerText = `Ada ${aheadData.length} antrean di depan Anda`;
            
            const inProgress = aheadData.filter(q => q.status === 'scanned' || q.status === 'called').length;
            const waiting = aheadData.filter(q => q.status === 'queueing' || q.status === 'waiting').length;
            
            let details = [];
            if (inProgress > 0) details.push(`${inProgress} sedang foto`);
            if (waiting > 0) details.push(`${waiting} menunggu`);
            
            qPosDetails.innerText = details.join(' • ');
          } else {
            displayStatus.innerText = "MENGANTRE";
            displayStatus.className = "inline-block px-4 py-1 border-2 border-charcoal bg-gold text-white font-bold tracking-[0.2em] uppercase text-sm";
            statusHint.innerText = "Harap tunggu giliran Anda. Kami akan segera memanggil Anda.";
            statusHint.className = "text-xs text-charcoal/70 mt-3 px-2 italic font-serif";
            statusHint.classList.remove('hidden');
            qPosBox.classList.add('hidden');
          }
        } else if (status === 'called') {
          displayStatus.innerText = "DIPANGGIL";
          displayStatus.className = "inline-block px-4 py-1 border-2 border-charcoal bg-forest text-white font-bold tracking-[0.2em] uppercase text-sm animate-pulse";
          statusHint.innerText = "Giliran Anda telah dipanggil! Silakan segera menuju booth.";
          statusHint.className = "text-sm font-bold text-forest mt-3 px-2 uppercase tracking-wider";
          statusHint.classList.remove('hidden');
          qPosBox.classList.add('hidden');
        } else if (status === 'scanned' || status === 'completed') {
          displayStatus.innerText = "MENGALIHKAN...";
          displayStatus.className = "inline-block px-4 py-1 border-2 border-charcoal bg-forest text-white font-bold tracking-[0.2em] uppercase text-sm";
          statusHint.innerText = "Membuka halaman foto dan video Anda...";
          statusHint.className = "text-xs text-charcoal/70 mt-3 px-2 italic font-serif";
          statusHint.classList.remove('hidden');
          qPosBox.classList.add('hidden');
          
          if (!isRedirecting) {
            isRedirecting = true;
            window.location.href = "softfile.html?code=" + encodeURIComponent(queueData.code);
          }
        } else if (status === 'cancelled' || status === 'canceled' || status === 'expired') {
          displayStatus.innerText = status.toUpperCase();
          displayStatus.className = "inline-block px-4 py-1 border-2 border-charcoal bg-wine text-white font-bold tracking-[0.2em] uppercase text-sm";
          statusHint.innerText = "Tiket ini sudah tidak berlaku atau dibatalkan. Silakan hubungi staff.";
          statusHint.className = "text-xs text-wine mt-3 px-2 font-semibold";
          statusHint.classList.remove('hidden');
          qPosBox.classList.add('hidden');
        } else {
          displayStatus.innerText = status.toUpperCase() || "TIDAK DIKETAHUI";
          displayStatus.className = "inline-block px-4 py-1 border-2 border-charcoal bg-charcoal text-white font-bold tracking-[0.2em] uppercase text-sm";
          statusHint.innerText = "Status antrean saat ini: " + queueData.status;
          statusHint.className = "text-xs text-charcoal/70 mt-3 px-2 italic font-serif";
          statusHint.classList.remove('hidden');
          qPosBox.classList.add('hidden');
        }
      }

      async function fetchTicket() {
        if (!ticketCode) {
          showError("Kode voucher tidak ditemukan di URL.", false);
          return;
        }

        const client = getSupabase();
        if (!client) {
          showError("Koneksi database gagal.");
          return;
        }

        if (isFetching || isRedirecting) return;
        isFetching = true;

        try {
          // 1. Check active queue in tjf_queue
          const { data, error } = await client
            .from("tjf_queue")
            .select("*")
            .eq("code", ticketCode)
            .maybeSingle();

          if (data) {
            let aheadData = [];
            const status = (data.status || '').toLowerCase();

            if ((status === 'queueing' || status === 'waiting') && data.booth_id) {
              const { data: aData } = await client
                .from("tjf_queue")
                .select("status, id, queue_number")
                .eq("booth_id", data.booth_id)
                .in("status", ["queueing", "waiting", "scanned", "called"]);
                
              if (aData) {
                aheadData = aData.filter(q => compareQueueNumbers(q.queue_number, data.queue_number) < 0);
              }
            }

            updateUI(data, aheadData);
            return;
          }

          // 2. Fallback: Check tjf_sessions table for finished session
          const { data: sessionData } = await client
            .from("tjf_sessions")
            .select("code")
            .or(`code.eq.${ticketCode},code.ilike.%${ticketCode}%`)
            .maybeSingle();

          if (sessionData) {
            updateUI({ code: ticketCode, status: 'completed' });
            return;
          }

          // 3. Fallback: Check Supabase storage tjf_photos bucket
          try {
            const [res1, res2] = await Promise.all([
              client.storage.from("tjf_photos").list("photos", { limit: 10, search: `TJF_${ticketCode}` }),
              client.storage.from("tjf_photos").list("photos", { limit: 10, search: ticketCode }),
            ]);
            const files = [...(res1.data || []), ...(res2.data || [])];
            if (files.length > 0) {
              updateUI({ code: ticketCode, status: 'completed' });
              return;
            }
          } catch (storageErr) {
            console.warn("Storage search error:", storageErr);
          }

          // 4. Fallback: Check subfolder photos/{code} in storage
          try {
            const { data: subFiles } = await client.storage.from("tjf_photos").list(`photos/${ticketCode}`, { limit: 5 });
            if (subFiles && subFiles.length > 0) {
              updateUI({ code: ticketCode, status: 'completed' });
              return;
            }
          } catch (subErr) {
            console.warn("Subfolder search error:", subErr);
          }

          // Not found in queue, sessions, or storage
          showError("Tiket atau Softfile tidak ditemukan untuk kode ini.");

        } catch (e) {
          console.error(e);
          showError("Gangguan jaringan. Mencoba ulang...");
        } finally {
          isFetching = false;
        }
      }

      // Initial Fetch
      fetchTicket();

      // Poll every 3 seconds to get live status updates
      setInterval(fetchTicket, 3000);
    </script>
  </body>
</html>
